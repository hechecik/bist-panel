name: kripto-cek

on:
  schedule:
    # Kripto 24/7 işlem görür — hafta sonu dahil her 30 dakikada bir tazele.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kripto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kripto veri çek (bağımlılık yok — sadece stdlib)
        run: python scripts/kripto_cek.py

      - name: Commit + push (data/kripto.json)
        run: |
          git config user.name "bist-panel bot"
          git config user.email "96144326+hechecik@users.noreply.github.com"
          git add data/kripto.json
          if ! git diff --cached --quiet; then
            git commit -m "kripto veri guncelle $(date -u +'%d.%m %H:%M') UTC"
            git fetch origin
            git rebase origin/main --autostash || git rebase --abort
            git push
            echo "✅ kripto verisi push edildi"
          else
            echo "ℹ️ değişiklik yok"
          fi
