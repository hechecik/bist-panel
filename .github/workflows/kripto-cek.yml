name: kripto-cek

on:
  schedule:
    # Kripto 24/7 işlem görür — hafta sonu dahil her 30 dakikada bir tazele.
    # G01: :00/:30 yoğun dakikalarından kaydırıldı → :17/:47.
    # BAKIM (11.11.2026): GitHub schedule fiilen tetiklenmiyor → tetik-cek.yml yedek tetikleyici.
    - cron: '17,47 * * * *'
  workflow_dispatch:
  # G01 planlanan cron-job.org → repository_dispatch kurulumu YAPILMADI (repoda
  # secret yok, dispatch olayi sayisi 0). Yedek tetikleyici tetik-cek.yml, hedef
  # akislari dogrudan workflow_dispatch ile cagirir. Bu blok uyumluluk icin duruyor.
  repository_dispatch:
    types: [kripto]

permissions:
  contents: write

# Aynı görevin üst üste binen çalışmaları sıraya girer (gecikmeli cron yığılması)
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  kripto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kripto veri çek (bağımlılık yok — sadece stdlib)
        run: python scripts/kripto_cek.py

      - name: Commit + push (data/kripto.json)
        run: |
          git config user.name "bist-panel bot"
          git config user.email "hechecik@users.noreply.github.com"
          git add data/kripto.json
          if ! git diff --cached --quiet; then
            git commit -m "kripto veri guncelle $(date -u +'%d.%m %H:%M') UTC"
            # G01: 3 denemeli push döngüsü (reject → fetch+rebase+push)
            for i in 1 2 3; do
              if git fetch origin && git rebase origin/main --autostash && git push; then
                echo "✅ kripto verisi push edildi (deneme $i)"
                break
              fi
              git rebase --abort 2>/dev/null || true
              echo "⚠️ push denemesi $i başarısız, tekrar deneniyor"
              sleep $((i*10))
            done
          else
            echo "ℹ️ değişiklik yok"
          fi

      - name: Kesinti alarmi (healthchecks.io ping)
        if: success()
        env:
          HC: ${{ secrets.HC_URL_KRIPTO }}
        run: |
          if [ -n "$HC" ]; then curl -fsS -m 10 "$HC" || true; else echo "HC_URL_KRIPTO tanimli degil - atlandi"; fi

