name: ek-veri-cek

on:
  schedule:
    # Sabit getiri (tahvil/eurobond) + halka arz/temettü takvimi.
    # Günde 2 kez hafta içi: 06:00 UTC (TR 09:00) ve 15:00 UTC (TR 18:00, kapanış sonrası).
    # G01: :00 yoğun dakikasından kaydırıldı → :09 ve :19.
    - cron: '9,19 6,15 * * 1-5'
  workflow_dispatch:
  # G01: dış tetikleyici — ek veri, hisse (veri) tetikleyicisiyle birlikte çalışır
  repository_dispatch:
    types: [veri]

permissions:
  contents: write

# Aynı görevin üst üste binen çalışmaları sıraya girer (gecikmeli cron yığılması)
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ekveri:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Paket kurulumu
        run: pip install --quiet pandas numpy borsapy requests httpx

      - name: Sabit getiri çek (tahvil + eurobond) → data/getiri.json
        run: python scripts/getiri_cek.py
        continue-on-error: true

      - name: Takvim çek (halka arz + temettü) → data/takvim.json
        run: python scripts/takvim_cek.py
        continue-on-error: true

      - name: Commit + push (getiri.json + takvim.json)
        run: |
          git config user.name "bist-panel bot"
          git config user.email "hechecik@users.noreply.github.com"
          git add data/getiri.json data/takvim.json
          if ! git diff --cached --quiet; then
            git commit -m "sabit getiri + takvim guncelle $(date -u +'%d.%m %H:%M') UTC"
            # G01: 3 denemeli push döngüsü (reject → fetch+rebase+push)
            for i in 1 2 3; do
              if git fetch origin && git rebase origin/main --autostash && git push; then
                echo "✅ getiri + takvim verisi push edildi (deneme $i)"
                break
              fi
              git rebase --abort 2>/dev/null || true
              echo "⚠️ push denemesi $i başarısız, tekrar deneniyor"
              sleep $((i*10))
            done
          else
            echo "ℹ️ değişiklik yok"
          fi

      - name: Kesinti alarmı (healthchecks.io ping)
        if: success()
        run: curl -fsS -m 10 "${{ secrets.HC_URL_EKVERI }}" || true
