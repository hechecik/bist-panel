name: af-kontrol

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/af-kontrol.yml'

permissions:
  contents: write
  actions: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GITHUB_TOKEN actions:write testi
        env:
          TOK: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "POST daire dispatch -> $(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: token $TOK" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/hechecik/bist-panel/actions/workflows/af-kontrol.yml/dispatches" -d '{"ref":"main"}')"
          echo "POST repo dispatch -> $(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: token $TOK" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/hechecik/bist-panel/dispatches" -d '{"event_type":"af-test"}')"
