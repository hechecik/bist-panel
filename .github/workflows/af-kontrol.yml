name: af-kontrol

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/af-kontrol.yml'

permissions:
  contents: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Tetikleyici karsilastirma
        env:
          GHT: ${{ secrets.CRONJOB_TOKEN }}
        run: |
          chk(){ curl -s -o /dev/null -w "$1:%{http_code} " -X POST -H "Authorization: token $GHT" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" "https://api.github.com/repos/hechecik/bist-panel/actions/workflows/af-kontrol.yml/dispatches" -d '{"ref":"main"}'; }
          echo "scheduler_token: $([ -n "$GHT" ] && echo VAR || echo YOK)"
          chk dummy
          echo
