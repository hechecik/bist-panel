name: af-kontrol

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/af-kontrol.yml'

permissions:
  contents: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Kripto veri cek + zaman damgasi
        run: |
          start=$(date -u +%s)
          python scripts/kripto_cek.py
          echo "SURE_SN $(( $(date -u +%s) - start ))"
          echo "URETILDI $(python3 -c "import json;print(json.load(open('data/kripto.json'))['uretildi'])")"
          git diff --stat data/kripto.json
