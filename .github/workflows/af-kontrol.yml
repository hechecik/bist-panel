name: af-kontrol

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/af-kontrol.yml'

permissions:
  contents: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Yerel saat ve ortam
        run: |
          echo "RUNNER_UTC $(date -u +'%Y-%m-%d %H:%M:%S')"
          echo "TZ=$TZ CI=$CI"
          uptime
          free -m | head -2
