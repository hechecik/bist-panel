name: altin-cek

on:
  schedule:
    # Altın ~24/5 işlem görür (Pazr 22:00 – Cum 21:00 UTC).
    # Hafta içi: her 30 dakikada bir. Hafta sonu: 3 saatte bir.
    # G01: :00/:30 yoğun dakikalarından kaydırıldı → :11/:41 ve :13.
    - cron: '11,41 * * * 1-5'
    - cron: '13 */3 * * 0,6'
    # BAKIM (11.11.2026): GitHub schedule fiilen tetiklenmiyor → tetik-cek.yml yedek tetikleyici.
  workflow_dispatch:
  # G01 planlanan cron-job.org → repository_dispatch kurulumu YAPILMADI (repoda
  # secret yok, dispatch olayi sayisi 0). Yedek tetikleyici tetik-cek.yml, hedef
  # akislari dogrudan workflow_dispatch ile cagirir. Bu blok uyumluluk icin duruyor.
  repository_dispatch:
    types: [altin]

permissions:
  contents: write

# Aynı görevin üst üste binen çalışmaları sıraya girer (gecikmeli cron yığılması)
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  altin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Paket kurulumu
        run: pip install --quiet pandas numpy yfinance beautifulsoup4 httpx

      - name: Altın verisi çek + JSON üret
        run: python scripts/altin_cek.py

      - name: Commit + push (data/altin.json, sep_arsiv, altin_gecmis)
        run: |
          git config user.name "bist-panel bot"
          git config user.email "hechecik@users.noreply.github.com"
          # G10/G11: Actions'ın ürettiği arşiv ve karne dosyaları da commit'e girer.
          # Dosya yoksa komut hata vermez.
          git add data/altin.json
          [ -f data/sep_arsiv.json ] && git add data/sep_arsiv.json
          [ -f data/altin_gecmis.json ] && git add data/altin_gecmis.json
          true
          if ! git diff --cached --quiet; then
            git commit -m "altin veri guncelle $(date -u +'%d.%m %H:%M') UTC"
            # G01: 3 denemeli push döngüsü (reject → fetch+rebase+push)
            for i in 1 2 3; do
              if git fetch origin && git rebase origin/main --autostash && git push; then
                echo "✅ altın verisi push edildi (deneme $i)"
                break
              fi
              git rebase --abort 2>/dev/null || true
              echo "⚠️ push denemesi $i başarısız, tekrar deneniyor"
              sleep $((i*10))
            done
          else
            echo "ℹ️ değişiklik yok"
          fi

      - name: Kesinti alarmi (healthchecks.io ping)
        if: success()
        env:
          HC: ${{ secrets.HC_URL_ALTIN }}
        run: |
          if [ -n "$HC" ]; then curl -fsS -m 10 "$HC" || true; else echo "HC_URL_ALTIN tanimli degil - atlandi"; fi

