name: veri-cek

on:
  schedule:
    # Hafta içi TR seansı (09:40-18:10 TR = 06:40-15:10 UTC).
    # GitHub schedule UTC çalışır — 06-15 UTC = TR 09:00-18:59, açılış dahil tam seans.
    - cron: '*/15 6-15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  veri:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Paket kurulumu
        run: |
          pip install --quiet pandas numpy yfinance borsapy beautifulsoup4 httpx lxml requests

      - name: Veri çek + JSON üret
        run: python scripts/veri_cek.py

      - name: Commit + push (JSON güncelse)
        run: |
          git config user.name "bist-panel bot"
          git config user.email "96144326+hechecik@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "veri guncelle $(date -u +'%d.%m %H:%M') UTC"
            git fetch origin
            git rebase origin/main --autostash || {
              echo "rebase çakışması — veriyi koruyorum"
              git checkout --theirs data/piyasa.json 2>/dev/null || true
              git add -A
              git -c core.editor=true rebase --continue
            }
            git push
            echo "✅ push edildi"
          else
            echo "ℹ️ değişiklik yok"
          fi
