<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BIST Panel</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<meta name="description" content="BIST piyasa paneli — sinyaller, makro, test senaryoları. Seans içinde periyodik güncellenir.">
<style>
:root {
  color-scheme: dark;
  --bg:#0b0e14; --bg2:#11151f; --bg3:#161b27; --bd:#232a3b; --tx:#d7dde8; --tx2:#8b95a9;
  --up:#2ecc71; --down:#ff5c5c; --warn:#f0b90b; --info:#4da3ff; --accent:#7c5cff;
}
* { box-sizing:border-box; margin:0; padding:0; }
html { -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--tx); font-family:-apple-system,'Segoe UI',Roboto,system-ui,sans-serif; padding-bottom:70px; font-size:13px; }
/* ── ÜST BAR ── */
header { position:sticky; top:0; z-index:50; background:rgba(11,14,20,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--bd); padding:10px 16px; display:flex; align-items:center; gap:10px; }
.logo { font-size:21px; font-weight:800; letter-spacing:-.5px; }
.logo span { color:var(--accent); }
.live { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:11px; color:var(--tx2); }
.dot { width:8px; height:8px; border-radius:50%; background:var(--up); animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
.stale .dot { background:var(--warn); }
/* ── BAYAT VERİ BANDI (G01) ── */
#bayatBant { display:none; position:sticky; top:0; z-index:60; background:#b3261e; color:#fff; font-size:12px; font-weight:600; padding:8px 16px; text-align:center; border-bottom:1px solid #7f1a15; }
#bayatBant.on { display:block; }
/* ── ENDEKS + ÖZET ── */
.hero { padding:12px 16px 4px; }
.ex-card { background:linear-gradient(135deg,#141b2d 0%,#1a1233 100%); border:1px solid var(--bd); border-radius:16px; padding:14px 18px; position:relative; overflow:hidden; }
.ex-card::after { content:''; position:absolute; right:-40px; top:-40px; width:140px; height:140px; background:radial-gradient(circle,rgba(124,92,255,.25),transparent 70%); }
.ex-label { font-size:11px; color:var(--tx2); text-transform:uppercase; letter-spacing:1px; }
.ex-val { font-size:32px; font-weight:800; margin-top:2px; font-variant-numeric:tabular-nums; }
.ex-chg { font-size:13px; font-weight:600; margin-top:1px; }
.up { color:var(--up); } .down { color:var(--down); }
.ex-sub { display:flex; gap:14px; margin-top:8px; font-size:10.5px; color:var(--tx2); flex-wrap:wrap; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(80px,1fr)); gap:8px; margin-top:8px; }
.card { background:var(--bg2); border:1px solid var(--bd); border-radius:12px; padding:8px 6px; text-align:center; }
.card .t { font-size:9px; color:var(--tx2); text-transform:uppercase; letter-spacing:.5px; }
.card .v { font-size:17px; font-weight:800; margin-top:2px; }
/* ── MAKRO ── */
.makro { display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:8px; padding:10px 16px 4px; }
.mk { background:var(--bg2); border:1px solid var(--bd); border-radius:10px; padding:8px 10px; }
.mk .t { font-size:9px; color:var(--tx2); text-transform:uppercase; }
.mk .v { font-size:14px; font-weight:700; margin-top:1px; font-variant-numeric:tabular-nums; }
.mk .d { font-size:9.5px; font-weight:600; }
/* ── SEKMELER ── */
nav.tabs { position:fixed; bottom:0; left:0; right:0; z-index:50; display:flex; background:rgba(11,14,20,.95); backdrop-filter:blur(12px); border-top:1px solid var(--bd); padding-bottom:env(safe-area-inset-bottom); }
.tab { flex:1; padding:9px 2px 7px; text-align:center; font-size:9.5px; color:var(--tx2); cursor:pointer; border:none; background:none; transition:color .2s; }
.tab .ic { display:block; font-size:17px; margin-bottom:1px; }
.tab.active { color:var(--up); }
.tab.active .ic { transform:scale(1.08); }
/* ── İÇERİK ── */
main { padding:0 16px; }
.sec { display:none; } .sec.active { display:block; animation:fade .25s; }
@keyframes fade { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
h2 { font-size:14px; margin:14px 0 8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
h2 .cnt { font-size:10.5px; background:var(--bg3); border:1px solid var(--bd); padding:1px 8px; border-radius:20px; color:var(--tx2); }
/* ── ARAÇ ÇUBUĞU ── */
.toolbar { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
.toolbar input, .toolbar select { background:var(--bg2); border:1px solid var(--bd); color:var(--tx); border-radius:10px; padding:8px 12px; font-size:12.5px; outline:none; }
.toolbar input { flex:1; min-width:130px; }
.toolbar input:focus, .toolbar select:focus { border-color:var(--accent); }
.toolbar select { cursor:pointer; }
.btn { background:var(--bg3); border:1px solid var(--bd); color:var(--tx); border-radius:10px; padding:8px 13px; font-size:12.5px; cursor:pointer; font-weight:600; }
.btn:hover { border-color:var(--accent); }
/* ── GEÇE ANALİZİ (kompakt) ── */
.gece { background:var(--bg2); border:1px solid var(--bd); border-radius:14px; padding:0; margin-top:12px; }
.gece summary { padding:12px 14px; cursor:pointer; font-weight:700; font-size:13px; list-style:none; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.gece summary::-webkit-details-marker { display:none; }
.gece .ic { margin-left:auto; color:var(--tx2); font-size:11px; }
.gece .ic-body { padding:0 14px 14px; }
.gece .k { font-size:10px; color:var(--tx2); text-transform:uppercase; letter-spacing:.4px; margin:10px 0 4px; }
/* ── PORTFÖY ── */
.portfoy { background:var(--bg2); border:1px solid var(--bd); border-radius:14px; padding:12px 14px; margin-top:12px; }
.portfoy .top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; }
.portfoy .top .o { font-size:18px; font-weight:800; }
.portfoy input { background:var(--bg3); border:1px solid var(--bd); color:var(--tx); border-radius:8px; padding:6px 9px; font-size:12px; width:86px; outline:none; }
.portfoy input:focus { border-color:var(--accent); }
.pf-row { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid #1a2030; font-size:12px; flex-wrap:wrap; }
.pf-row .sym { min-width:52px; font-weight:700; }
.pf-row .sil { margin-left:auto; background:none; border:none; color:var(--down); cursor:pointer; font-size:14px; }
.pf-row .sifirla { background:none; border:none; color:var(--info); cursor:pointer; font-size:11px; }
/* ── TABLO ── */
.twrap { overflow-x:auto; border:1px solid var(--bd); border-radius:12px; background:var(--bg2); }
table { width:100%; border-collapse:collapse; font-size:11.5px; min-width:1060px; }
th { color:var(--tx2); text-align:left; padding:7px 5px; border-bottom:1px solid var(--bd); font-size:9px; text-transform:uppercase; letter-spacing:.4px; white-space:nowrap; background:var(--bg3); position:sticky; top:0; }
td { padding:7px 5px; border-bottom:1px solid #1a2030; font-variant-numeric:tabular-nums; white-space:nowrap; vertical-align:middle; }
tr:active { background:var(--bg3); }
tbody tr { cursor:pointer; }
tbody tr:hover { background:rgba(124,92,255,.06); }
.sym { font-weight:700; position:sticky; left:0; background:var(--bg2); z-index:1; }
th.sym { left:0; z-index:2; }
td.sym .bol { display:flex; flex-direction:column; gap:1px; margin-top:2px; font-size:9.5px; font-weight:400; color:var(--warn); line-height:1.25; white-space:nowrap; }
.badge { display:inline-block; padding:1px 7px; border-radius:20px; font-size:9.5px; font-weight:700; }
.b-AL { background:rgba(46,204,113,.15); color:var(--up); }
.b-DİKKAT_AL { background:rgba(240,185,11,.15); color:var(--warn); }
.b-TUT { background:rgba(139,149,169,.15); color:var(--tx2); }
.b-DİKKAT_SAT { background:rgba(255,92,92,.12); color:var(--warn); }
.b-SAT { background:rgba(255,92,92,.18); color:var(--down); }
.b-IZLE { background:rgba(139,149,169,.12); color:var(--tx2); border:1px dashed rgba(139,149,169,.45); }
.b-RISKLI { background:rgba(255,92,92,.22); color:var(--down); border:1px solid rgba(255,92,92,.55); }
.g05 { margin-top:4px; display:flex; flex-wrap:wrap; gap:3px; }
.g05 span { font-size:10px; padding:1px 5px; border-radius:8px; background:rgba(139,149,169,.16); color:var(--tx2); white-space:nowrap; }
.g05 .tavan { background:rgba(46,204,113,.18); color:var(--up); }
.g05 .taban { background:rgba(255,92,92,.18); color:var(--down); }
.g05 .ipo { background:rgba(52,152,219,.18); color:var(--info); }
.g05 .risk { background:rgba(255,92,92,.22); color:var(--down); font-weight:700; }
.g05 .tedbir { background:rgba(240,185,11,.18); color:var(--warn); }
.g05 .dusuk { background:rgba(139,149,169,.10); color:var(--tx2); font-style:italic; }
.ned { font-size:9.5px; color:var(--tx2); max-width:230px; white-space:normal; line-height:1.4; }
.ned b { color:var(--tx); }
tr.detail td { background:var(--bg3); padding:11px; white-space:normal; }
.det-ic { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px 14px; font-size:11px; line-height:1.6; }
.det-ic .k { color:var(--tx2); font-size:9.5px; text-transform:uppercase; letter-spacing:.4px; }
.det-ic ul { list-style:none; margin-top:2px; }
.det-ic li { padding:2px 0 2px 14px; position:relative; color:var(--tx); }
.det-ic li::before { content:'▸'; position:absolute; left:0; color:var(--accent); }
.fresh { display:inline-block; padding:1px 8px; border-radius:20px; font-size:9.5px; font-weight:700; background:rgba(240,185,11,.12); color:var(--warn); margin-left:8px; }
.fresh.ok { background:rgba(46,204,113,.12); color:var(--up); }
.fresh.bayat { background:rgba(231,76,60,.14); color:var(--down); }
/* ── SENARYO ── */
.scn { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.sc { background:var(--bg2); border:1px solid var(--bd); border-radius:14px; padding:12px 14px; }
.sc .t { font-size:10.5px; color:var(--tx2); }
.sc .o { font-size:24px; font-weight:800; margin-top:3px; }
.sc .m { font-size:10.5px; color:var(--tx2); margin-top:5px; line-height:1.5; }
.sc .m b { color:var(--tx); }
.sc.wide { grid-column:1/-1; }
.bar { height:5px; border-radius:4px; background:#1a2030; margin-top:7px; overflow:hidden; display:flex; }
.bar i { display:block; height:100%; }
/* ── TAKVİM / HABER ── */
.ev { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid #1a2030; align-items:flex-start; }
.ev .tm { min-width:40px; font-size:10.5px; color:var(--tx2); font-variant-numeric:tabular-nums; padding-top:2px; }
.ev .dt { font-size:10.5px; color:var(--tx2); min-width:40px; }
.ev .nm { font-size:12px; line-height:1.4; }
.hi { color:var(--down); font-weight:700; } .mi { color:var(--warn); }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin:5px 0 10px; }
.chip { background:var(--bg3); border:1px solid var(--bd); border-radius:20px; padding:3px 10px; font-size:11px; cursor:pointer; color:var(--tx2); transition:border-color .15s, color .15s; }
.chip:hover { border-color:var(--accent); color:var(--tx); }
.chip.active { border-color:var(--up); color:var(--up); font-weight:700; }
.chip b { font-weight:700; }
.chip .r { color:var(--tx2); font-size:9.5px; }
.tcmb { background:var(--bg2); border:1px solid var(--bd); border-radius:14px; padding:12px 14px; font-size:12.5px; line-height:1.6; }
.tcmb b { color:var(--tx); }
.note { font-size:10px; color:var(--tx2); line-height:1.5; margin:12px 0 6px; }
.empty { color:var(--tx2); font-size:12px; padding:16px 0; text-align:center; }
/* ── KRİPTO ── */
.kr-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(156px,1fr)); gap:10px; margin-top:10px; }
.kr { background:var(--bg2); border:1px solid var(--bd); border-radius:14px; padding:10px 12px; }
.kr .hd { display:flex; align-items:center; gap:6px; }
.kr .ksym { font-weight:800; font-size:13px; }
.kr .rank { font-size:9px; color:var(--tx2); }
.kr .nm { margin-left:auto; font-size:9.5px; color:var(--tx2); max-width:64px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.kr .pz { font-size:17px; font-weight:800; margin-top:6px; font-variant-numeric:tabular-nums; }
.kr .tl { font-size:10.5px; color:var(--tx2); margin-top:1px; font-variant-numeric:tabular-nums; }
.kr .ch { display:flex; gap:12px; margin-top:7px; font-size:11px; font-weight:700; font-variant-numeric:tabular-nums; }
.kr .ch .lb { color:var(--tx2); font-weight:500; font-size:9px; }
.kr .sp { margin-top:6px; line-height:0; }
.kr .ft { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-top:7px; }
.kr .kskor { font-size:11px; font-weight:800; }
.kr .note2 { font-size:9px; color:var(--tx2); margin-top:5px; line-height:1.4; }
.stable { font-size:9.5px; color:var(--tx2); font-weight:700; }
/* ── ICT TARAYICI (Katman 2 — PineScript mantığı) ── */
.ict-list { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
.ict-row { display:flex; align-items:baseline; gap:8px; background:var(--bg2); border:1px solid var(--bd);
  border-radius:10px; padding:7px 10px; font-size:11.5px; line-height:1.45; }
.ict-row .sym { font-weight:800; font-size:12.5px; min-width:52px; }
.ict-row .px { color:var(--tx2); font-variant-numeric:tabular-nums; min-width:62px; }
.ict-row .tag { font-size:9.5px; font-weight:800; padding:1px 7px; border-radius:6px; white-space:nowrap; }
.ict-row .tag.up { background:rgba(46,204,113,.14); color:var(--up); }
.ict-row .tag.dn { background:rgba(255,92,92,.14); color:var(--down); }
.ict-row .tag.nötr, .ict-row .tag.notr { background:rgba(240,185,11,.13); color:var(--warn); }
.ict-row .dsc { color:var(--tx2); font-size:10.5px; flex:1; }
.ict-row .skor { font-weight:800; font-variant-numeric:tabular-nums; }
.ict-not { font-size:10px; color:var(--tx2); margin-top:9px; line-height:1.5; padding:8px 10px;
  background:var(--bg2); border:1px dashed var(--bd); border-radius:10px; }
/* ── ALTIN (ONS) BÖLÜMÜ ── */
.al-perf { display:flex; flex-wrap:wrap; gap:6px; margin:9px 0; }
.al-perf .p { background:var(--bg2); border:1px solid var(--bd); border-radius:9px; padding:5px 9px;
  font-size:10.5px; display:flex; gap:6px; align-items:center; color:var(--tx2); }
.al-perf .p b { font-variant-numeric:tabular-nums; }
.al-lv { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:9px; }
.al-lv .box { background:var(--bg2); border:1px solid var(--bd); border-radius:12px; padding:9px 11px; }
.al-lv .box h3 { font-size:10.5px; margin:0 0 6px; letter-spacing:.6px; text-transform:uppercase; color:var(--tx2); }
.al-lv .lv { display:flex; justify-content:space-between; gap:8px; font-size:11px; padding:4px 0;
  border-bottom:1px solid #1a2030; align-items:baseline; }
.al-lv .lv:last-child { border-bottom:none; }
.al-lv .lv b { font-variant-numeric:tabular-nums; font-weight:800; }
.al-lv .lv .tp { color:var(--tx2); font-size:9px; }
.al-lv .lv .dz { font-variant-numeric:tabular-nums; font-size:10px; }
.al-bi { display:inline-block; padding:2px 11px; border-radius:20px; font-weight:800; font-size:11px; }
.al-bi.boga { background:rgba(46,204,113,.15); color:var(--up); }
.al-bi.ayi  { background:rgba(255,92,92,.15); color:var(--down); }
.al-bi.notr { background:rgba(240,185,11,.15); color:var(--warn); }
/* ── ICT SÖZLÜK / SENARYO ── */
.ict-soz { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:8px; margin-top:8px; }
.ict-soz .k { background:var(--bg2); border:1px solid var(--bd); border-radius:10px; padding:8px 10px;
  font-size:10.5px; line-height:1.5; color:var(--tx2); }
.ict-soz .k b { color:var(--tx); font-size:11.5px; display:block; margin-bottom:2px; }
/* ── MUM GRAFİK MODALI ── */
.gbtn { background:none; border:none; cursor:pointer; font-size:15px; padding:2px 6px; border-radius:6px; }
.gbtn:hover { background:var(--bg3); }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:200; display:none; align-items:center; justify-content:center; padding:12px; }
.modal-box { width:100%; max-width:680px; height:75vh; background:var(--bg2); border:1px solid var(--bd); border-radius:16px; padding:12px; display:flex; flex-direction:column; }
.modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:15px; font-weight:700; }
.modal-head .x { font-size:18px; padding:2px 10px; }
/* ── ZİYARETÇİ GÖSTERGESİ ── */
.ziyaretci { text-align:center; font-size:10.5px; color:var(--tx2); padding:16px 16px 2px; letter-spacing:.3px; }
.ziyaretci b { color:var(--tx); font-weight:700; font-variant-numeric:tabular-nums; }
.ziyaretci .zi-dot { color:var(--up); }
</style>
</head>
<body>

<div id="bayatBant" role="alert"></div>

<header>
  <div class="logo">BIST<span>·PANEL</span></div>
  <div class="live" id="liveInfo"><span class="dot"></span><span id="liveText">bekleniyor</span></div>
</header>

<div class="hero">
  <div class="ex-card">
    <div class="ex-label">BIST 100 · XU100</div>
    <div class="ex-val" id="exVal">—</div>
    <div class="ex-chg" id="exChg"></div>
    <div class="ex-sub" id="exSub"></div>
    <div class="cards" id="ozetKartlar"></div>
  </div>
</div>

<div class="makro" id="makroRow"></div>

<main>
  <section class="sec active" id="sec-piyasa"></section>
  <section class="sec" id="sec-grafik"></section>
  <section class="sec" id="sec-altin"></section>
  <section class="sec" id="sec-kripto"></section>
  <section class="sec" id="sec-senaryo"><div id="karne-hesap"></div><div id="karne-icerik"></div></section>
  <section class="sec" id="sec-haber"></section>
  <section class="sec" id="sec-takvim"></section>
  <section class="sec" id="sec-fon"><div id="getiri-blok"></div><div id="fon-icerik"></div></section>
  <section class="sec" id="sec-ict"></section>
</main>

<div class="ziyaretci">👥 Bugün <b id="zyBugun">—</b> · Toplam <b id="zyToplam">—</b> ziyaretçi</div>

<nav class="tabs">
  <button class="tab active" data-sec="piyasa"><span class="ic">📊</span>Piyasa</button>
  <button class="tab" data-sec="grafik"><span class="ic">📈</span>Grafik</button>
  <button class="tab" data-sec="altin"><span class="ic">🥇</span>Altın</button>
  <button class="tab" data-sec="kripto"><span class="ic">🪙</span>Kripto</button>
  <button class="tab" data-sec="senaryo"><span class="ic">📋</span>Karne</button>
  <button class="tab" data-sec="haber"><span class="ic">📰</span>Haberler</button>
  <button class="tab" data-sec="takvim"><span class="ic">📅</span>Takvim</button>
  <button class="tab" data-sec="fon"><span class="ic">💵</span>Getiri</button>
  <button class="tab" data-sec="ict"><span class="ic">🧭</span>ICT</button>
</nav>

<!-- MUM GRAFİK MODALI -->
<div class="modal" id="grafikModal" onclick="if(event.target===this)grafikKapat()">
  <div class="modal-box">
    <div class="modal-head"><span id="modalSym">—</span><button class="gbtn x" onclick="grafikKapat()">✕</button></div>
    <div id="modalWidget" style="flex:1;min-height:0"></div>
  </div>
</div>

<script>
/* Zaman damgası: eski veri saat dilimi içermeyen UTC yazıyordu → 'Z' ekleyerek UTC olarak yorumla.
   Gösterim her zaman Europe/Istanbul. */
function utcTarih(s) {
  if (!s) return new Date(NaN);
  // RFC-2822 ('Wed, 11 Nov 2026 04:23:18 GMT') tarihleri aynen geçerli — 'Z' eklenirse bozulur.
  if (/[a-zA-Z]{3},/.test(s) || /GMT|UTC|[+-]\d\d:?\d\d$|[zZ]$/.test(s)) return new Date(s);
  return new Date(s + 'Z');
}
const SEC = document.querySelectorAll('.tab');
SEC.forEach(t => t.addEventListener('click', () => {
  SEC.forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  document.querySelectorAll('.sec').forEach(s => s.classList.remove('active'));
  document.getElementById('sec-' + t.dataset.sec).classList.add('active');
  if (t.dataset.sec === 'grafik' && typeof tvYukle === 'function') tvYukle();
  if (t.dataset.sec === 'altin') altinYukle();
  if (t.dataset.sec === 'kripto') kriptoYukle();
  if (t.dataset.sec === 'ict') ictYukle();
  if (t.dataset.sec === 'takvim') takvimYukle();
  if (t.dataset.sec === 'fon') getiriYukle();
}));

const fmt = (n, d=2) => n == null ? '—' : Number(n).toLocaleString('tr-TR', {minimumFractionDigits:d, maximumFractionDigits:d});
const yuzde = n => n == null ? '' : (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
const ok = n => n >= 0 ? 'up' : 'down';

function badge(s) {
  const m = {'AL':'b-AL','DİKKAT_AL':'b-DİKKAT_AL','TUT':'b-TUT','DİKKAT_SAT':'b-DİKKAT_SAT','SAT':'b-SAT',
             'IZLE':'b-IZLE','RISKLI':'b-RISKLI'};
  return `<span class="badge ${m[s]||'b-TUT'}">${s}</span>`;
}

/* ══════════ G05 — BIST filtreleri ══════════ */
function g05Cipleri(r) {
  const c = [];
  if (r.kilit === 'TAVAN') c.push('<span class="tavan" title="Kapanış gün yükseğinde, +%9,5 ve üzeri">🔒 TAVAN</span>');
  if (r.kilit === 'TABAN') c.push('<span class="taban" title="Kapanış gün düşüğünde, −%9,5 ve altı">🔒 TABAN</span>');
  if (r.ipo_yeni) c.push(`<span class="ipo" title="Son 60 iş günü içinde işlem görmeye başladı${r.ipo_tarih ? ' · ilk bar ' + r.ipo_tarih : ''}">🆕 YENİ ARZ</span>`);
  if (r.riskli) c.push(`<span class="risk" title="${r.riskli}">⛔ RİSKLİ — ${r.riskli}</span>`);
  if (r.tedbir) c.push(`<span class="tedbir" title="VBTS tedbiri">⛔ TEDBİR: ${r.tedbir}</span>`);
  if (r.likidite_tl != null && r.likidite_tl < 50000000)
    c.push(`<span class="dusuk" title="20 günlük ort. TL hacmi eşiğin altında (50 mn ₺)">💧 ${fmt(r.likidite_tl/1000000,1)} mn ₺</span>`);
  if (r.filtre) c.push(`<span class="tedbir" title="Ham sinyal: ${r.sinyal_ham || '—'}">⤵ ${r.filtre}</span>`);
  return c.length ? `<div class="g05">${c.join('')}</div>` : '';
}

/* ── YORUMLAR ── */
function rsiYorum(r) {
  if (r.rsi == null) return '';
  if (r.rsi < 30) return `<span style="color:var(--info)">${fmt(r.rsi,0)} aşırı satım</span>`;
  if (r.rsi > 70) return `<span style="color:var(--down)">${fmt(r.rsi,0)} aşırı alım</span>`;
  if (r.rsi >= 55) return `<span style="color:var(--up)">${fmt(r.rsi,0)} güçlü</span>`;
  if (r.rsi >= 45) return `<span style="color:var(--tx)">${fmt(r.rsi,0)} nötr</span>`;
  return `<span style="color:var(--warn)">${fmt(r.rsi,0)} zayıf</span>`;
}
/* G09 — gölge mod göstergeleri (skor/sinyale girmez, sadece gösterim) */
function hacimOranHtml(r) {
  if (r.HACIM_ORAN == null) return '—';
  const v = r.HACIM_ORAN;
  const renk = v >= 2 ? 'var(--up)' : (v <= 0.6 ? 'var(--tx2)' : 'var(--tx)');
  return `<span style="color:${renk}" title="${v >= 1.5 ? 'Ortalamanın belirgin üzerinde hacim' : v <= 0.6 ? 'Ortalamanın altında hacim' : 'Normal hacim'}">${fmt(v,2)}×</span>`;
}
/* G09 — piyasa genişliği kartı (piyasa sekmesi) */
function genislikHtml(g) {
  if (!g || g.durum === 'veri yok' || g.ma50_ustu_yuzde == null) return '';
  const renk = g.ma50_ustu_yuzde >= 60 ? 'var(--up)' : (g.ma50_ustu_yuzde <= 40 ? 'var(--down)' : 'var(--warn)');
  return `<h2>📐 Piyasa Genişliği <span class="cnt">${g.hisse || ''} hisse · ${g.tarih || ''}</span></h2>` +
    `<div class="cards">` +
    `<div class="card"><div class="t">MA50 üstü</div><div class="v" style="color:${renk}">%${fmt(g.ma50_ustu_yuzde,1)}</div><div class="t">${g.ma50_ustu == null ? '' : g.ma50_ustu + ' hisse'}</div></div>` +
    `<div class="card"><div class="t">Yükselen</div><div class="v up">${g.yukselen == null ? '—' : g.yukselen}</div></div>` +
    `<div class="card"><div class="t">Düşen</div><div class="v down">${g.dusen == null ? '—' : g.dusen}</div></div>` +
    `<div class="card"><div class="t">52h zirve</div><div class="v up">${g.yeni_zirve_52h == null ? '—' : g.yeni_zirve_52h}</div></div>` +
    `<div class="card"><div class="t">52h dip</div><div class="v down">${g.yeni_dip_52h == null ? '—' : g.yeni_dip_52h}</div></div>` +
    `</div>`;
}
function mfiYorum(r) {
  if (r.mfi == null) return '—';
  const renk = r.para === 'GİRİŞ' ? 'var(--up)' : (r.para === 'ÇIKIŞ' ? 'var(--down)' : 'var(--tx)');
  return `<span style="color:${renk}">${fmt(r.mfi,0)} ${r.para || ''}</span>`;
}
function trendHtml(r) {
  if (r.trend === 'YUKARI') return '▲ <span class="up">YUKARI</span>';
  if (r.trend === 'AŞAĞI') return '▼ <span class="down">AŞAĞI</span>';
  return '▶ <span style="color:var(--tx2)">YATAY</span>';
}
function squeezeHtml(r) {
  const s = (r.squeeze || '').toUpperCase();
  if (s.includes('YUKARI')) return '🚀 <span class="up">KIRILIM ↑</span>';
  if (s.includes('AŞAĞI')) return '🕳️ <span class="down">KIRILIM ↓</span>';
  if (s.includes('SIKIŞMA')) return '🧲 <span style="color:var(--warn)">SIKIŞMA</span>';
  return '—';
}
function sparkSVG(r) {
  if (!r.spark || r.spark.length < 2) return '—';
  const v = r.spark;
  const min = Math.min(...v), max = Math.max(...v);
  const W = 84, H = 26, span = (max - min) || 1;
  const pts = v.map((x, i) => `${(i/(v.length-1)*W).toFixed(1)},${(H-2-((x-min)/span)*(H-4)).toFixed(1)}`).join(' ');
  const renk = v[v.length-1] >= v[0] ? 'var(--up)' : 'var(--down)';
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline points="${pts}" fill="none" stroke="${renk}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* ── VERİ TAZELİĞİ ── */
function tazelik(veriTarihi) {
  if (!veriTarihi) return '';
  const gun = Math.floor((Date.now() - new Date(veriTarihi + 'T18:00:00').getTime()) / 86400000);
  if (gun <= 1) return '<span class="fresh ok">BUGÜN</span>';
  return `<span class="fresh">${gun} GÜN ESKİ</span>`;
}

/* ── BAYAT VERİ BANDI (G01) ──
   Hisse verisi hafta içi 1 iş gününden eskiyse, altın verisi 2 saatten eskiyse
   sayfanın üstünde kırmızı bant gösterilir. */
const BAYAT = { hisse: null, altin: null };
function haftaIciIsGunu(ms) {           // ms: geçen süre → aşılan iş günü (tam gün)
  if (!isFinite(ms) || ms < 0) return 0;
  let kalan = ms, isGunu = 0, adim = 0;
  while (kalan >= 86400000 && adim < 400) {
    kalan -= 86400000; adim++;
    const gun = new Date(Date.now() - kalan).getDay();
    if (gun !== 0 && gun !== 6) isGunu++;
  }
  return isGunu;
}
function bayatBantMetni(hisseYasMs, altinYasMs) {
  const parca = [];
  if (isFinite(hisseYasMs) && haftaIciIsGunu(hisseYasMs) > 1)
    parca.push('Hisse verisi ' + Math.floor(hisseYasMs / 3600000) + ' saattir güncellenmedi');
  if (isFinite(altinYasMs) && altinYasMs > 7200000)
    parca.push('Altın verisi ' + Math.floor(altinYasMs / 3600000) + ' saattir güncellenmedi');
  return parca.length ? '⚠️ ' + parca.join(' · ') : '';
}
function bayatBantGuncelle() {
  const el = document.getElementById('bayatBant');
  if (!el) return;
  const simdi = Date.now();
  const hisseYas = BAYAT.hisse ? simdi - BAYAT.hisse.getTime() : NaN;
  const altinYas = BAYAT.altin ? simdi - BAYAT.altin.getTime() : NaN;
  const metin = bayatBantMetni(hisseYas, altinYas);
  if (metin) { el.textContent = metin; el.classList.add('on'); }
  else { el.textContent = ''; el.classList.remove('on'); }
}

/* ── TABLO ── */
const KOLONLAR = ['Hisse','Grafik','Fiyat','1A','RS20','Hacim','Skor','Sinyal','Trend','Para','RSI','MFI','Squeeze','S1/R1','SL/Hdf','Neden','📈'];

function hisseSatir(r, durum) {
  const onceki = durum.detay.get(r.sembol);
  const bol = (durum.bolunme || []).filter(b => b.sembol === r.sembol);
  const bolNot = bol.length
    ? `<div class="bol"><span>⚙️ bölünme düzeltildi</span>` +
      bol.map(b => `<span>${b.tarih} · oran ${b.oran}</span>`).join('') + `</div>`
    : '';
  let html = `<tr data-sym="${r.sembol}">` +
    `<td class="sym">${r.sembol}${bolNot}${g05Cipleri(r)}</td>` +
    `<td>${sparkSVG(r)}</td>` +
    `<td>${fmt(r.fiyat)}</td>` +
    `<td class="${ok(r.ay_oncesi)}">${r.ay_oncesi == null ? '—' : yuzde(r.ay_oncesi)}</td>` +
    `<td class="${ok(r.RS20)}" title="RS20 — hisse/XU100 oranının 20 günlük değişimi">${r.RS20 == null ? '—' : yuzde(r.RS20)}</td>` +
    `<td title="Hacim oranı — bugünkü hacim / 20 günlük medyan">${hacimOranHtml(r)}</td>` +
    `<td style="color:${r.skor>=3?'var(--up)':r.skor<=-3?'var(--down)':'var(--warn)'};font-weight:700">${r.skor>0?'+':''}${r.skor}</td>` +
    `<td>${badge(r.sinyal)}</td>` +
    `<td>${trendHtml(r)}</td>` +
    `<td>${mfiYorum(r)}</td>` +
    `<td>${rsiYorum(r)}</td>` +
    `<td>${r.mfi == null ? '—' : fmt(r.mfi,0)}</td>` +
    `<td>${squeezeHtml(r)}</td>` +
    `<td>${r.s1 == null ? '—' : `<span style="color:var(--down)">${fmt(r.s1)}</span> / <span style="color:var(--up)">${fmt(r.r1)}</span>`}</td>` +
    `<td>${r.stop == null ? '—' : `${fmt(r.stop)} / ${fmt(r.hedef)}`}</td>` +
    `<td class="ned">${(r.nedenler||[]).slice(0,2).map(n=>'▸ '+n).join('<br>')}</td>` +
    `<td><button class="gbtn" onclick="event.stopPropagation();grafikModal('${r.sembol}')" title="Mum grafiği aç">📈</button></td></tr>`;
  if (onceki) {
    html += `<tr class="detail" data-det="${r.sembol}"><td colspan="${KOLONLAR.length}"><div class="det-ic">` +
      `<div><div class="k">📋 Tüm Nedenler</div><ul>${(r.nedenler||[]).map(n=>`<li>${n}</li>`).join('')}</ul></div>` +
      `<div><div class="k">🎯 Seviyeler</div><ul>` +
      `<li>1. Destek (S1): <b>${r.s1 == null ? '—' : fmt(r.s1)}</b></li>` +
      `<li>1. Direnç (R1): <b>${r.r1 == null ? '—' : fmt(r.r1)}</b></li>` +
      `<li>Stop-loss: <b>${r.stop == null ? '—' : fmt(r.stop)}</b></li>` +
      `<li>Hedef: <b>${r.hedef == null ? '—' : fmt(r.hedef)}</b></li></ul></div>` +
      `<div><div class="k">📅 Veri</div><ul>` +
      `<li>Son bar: <b>${r.tarih || '—'}</b></li>` +
      `<li>1A getiri: <b class="${ok(r.ay_oncesi)}">${r.ay_oncesi == null ? '—' : yuzde(r.ay_oncesi)}</b></li>` +
      `<li>MACD hist: <b>${r.macd_hist == null ? '—' : r.macd_hist}</b></li>` +
      `<li>RS20 (XU100'e göre): <b class="${ok(r.RS20)}">${r.RS20 == null ? '—' : yuzde(r.RS20)}</b></li>` +
      `<li>RS60: <b class="${ok(r.RS60)}">${r.RS60 == null ? '—' : yuzde(r.RS60)}</b></li>` +
      `<li>Hacim oranı (20g medyan): <b>${r.HACIM_ORAN == null ? '—' : fmt(r.HACIM_ORAN,2) + '×'}</b></li>` +
      `<li>VOL20 (günlük getiri std): <b>${r.VOL20 == null ? '—' : '%' + fmt(r.VOL20,2)}</b></li>` +
      `<li>52h zirveye uzaklık: <b>${r.ZIRVE_UZAK == null ? '—' : yuzde(r.ZIRVE_UZAK)}</b></li>` +
      `<li>Trend/ATR: <b>${r.TREND_ATR == null ? '—' : fmt(r.TREND_ATR,2)}</b></li>` +
      `<li>Analiz: <b>${durum.hesapTarihi || '—'}</b></li></ul></div>` +
      `<div><div class="k">🔎 G05 Filtre</div><ul>` +
      `<li>Kilit: <b>${r.kilit || 'yok'}</b></li>` +
      `<li>Likidite (20g): <b>${r.likidite_tl == null ? '—' : fmt(r.likidite_tl/1000000,1) + ' mn ₺'}</b></li>` +
      `<li>Yeni arz: <b>${r.ipo_yeni ? 'evet' + (r.ipo_tarih ? ' · ' + r.ipo_tarih : '') : 'hayır'}</b></li>` +
      `<li>VBTS tedbir: <b>${r.tedbir || 'yok'}</b></li>` +
      `<li>Taban (10g): <b>${r.taban_10g == null ? '—' : r.taban_10g}</b></li>` +
      `<li>Filtre: <b>${r.filtre || '—'}</b>${r.sinyal_ham ? ` <span style="color:var(--tx2)">(ham: ${r.sinyal_ham})</span>` : ''}</li></ul></div>` +
      `</div></td></tr>`;
  }
  return html;
}

let durum = { detay: new Map(), hesapTarihi: '', bolunme: [] };

function tabloBolum(baslik, ikon, liste) {
  let html = `<h2>${ikon} ${baslik} <span class="cnt">${liste.length}</span></h2>`;
  if (!liste.length) return html + '<div class="empty">Sonuç yok</div>';
  html += `<div class="twrap"><table><tr>` + KOLONLAR.map(k => `<th class="${k==='Hisse'?'sym':''}">${k}</th>`).join('') + '</tr><tbody>';
  liste.forEach(r => html += hisseSatir(r, durum));
  return html + '</tbody></table></div>';
}

async function yukle() {
  try {
    const d = await (await fetch('data/piyasa.json?v=' + Date.now())).json();
    durum.hesapTarihi = (d.sinyaller && d.sinyaller.hesap_tarihi) || '';
    durum.bolunme = (d.saglik && d.saglik.bolunme_duzeltme) || [];
    renderPiyasa(d); renderGrafik(d); renderSenaryo(d); renderHaber(d); renderFon(d);
    getiriYukle(); takvimYukle();
    alarmKontrol(); // 3+6 — fiyat eşik alarmları
    const gun = new Date().getDay();
    const ure = utcTarih(d.uretildi);
    BAYAT.hisse = ure; bayatBantGuncelle();   // G01: bayat veri bandı
    const fark = Math.floor((Date.now() - ure.getTime()) / 60000);
    const lt = document.getElementById('liveText');
    if (gun === 0 || gun === 6) {
      lt.textContent = 'Borsa kapalı · ' + (d.endeks ? d.endeks.tarih + ' kapanış' : '') + ' · ' + ure.toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit',timeZone:'Europe/Istanbul'});
      document.querySelector('header').classList.add('stale');
    } else if (fark <= 20) {
      lt.textContent = (fark <= 1 ? 'CANLI' : fark + ' dk önce') + ' · ' + ure.toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit',timeZone:'Europe/Istanbul'});
    } else {
      lt.textContent = '⏳ ' + fark + ' dk önce · ' + ure.toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit',timeZone:'Europe/Istanbul'});
      document.querySelector('header').classList.add('stale');
    }
  } catch(e) {
    document.getElementById('sec-piyasa').innerHTML = '<div class="empty">Veri yüklenemedi: ' + e.message + '</div>';
  }
}

/* ══════════ PİYASA ══════════ */
let PIYASA_VERI = null;
function renderPiyasa(d) {
  PIYASA_VERI = d;
  const e = d.endeks;
  if (e) {
    document.getElementById('exVal').textContent = fmt(e.deger, 2);
    const chg = document.getElementById('exChg');
    chg.innerHTML = `<span class="${ok(e.degisim_yuzde)}">${yuzde(e.degisim_yuzde)}</span> gün`;
    document.getElementById('exSub').innerHTML =
      `<span>📅 ${e.tarih}</span><span>🔍 ${d.sinyaller.toplam} hisse</span><span>📡 ${d.kaynak}</span>` +
      (d.saglik ? `<span class="${d.saglik.durum === 'OK' ? 'up' : 'down'}">🩺 ${d.saglik.durum}${d.saglik.sorunlar.length ? ' · ' + d.saglik.sorunlar.join(', ') : ''}</span>` : '');
  }
  const s = d.sinyaller;
  const alSay = (s.al||[]).length, tutSay = (s.tut||[]).length, satSay = (s.sat||[]).length;
  const izleSay = (s.izle||[]).length, riskliSay = (s.riskli||[]).length;
  // G05 md.3 — geçici: seans sürüyor veya kapanış verisi henüz gelmedi (18:30'a kadar)
  const durumEtiket = s.durum ? ` · <span class="${s.durum === 'kesin' ? 'up' : 'warn'}" title="${s.durum === 'kesin' ? 'Bar kapandı, sinyal kesinleşti' : 'Seans sürüyor veya kapanış verisi henüz gelmedi (18:30\'a kadar)'}">${s.durum === 'kesin' ? '✅ kesin' : '⏳ geçici'}</span>` : '';
  document.getElementById('ozetKartlar').innerHTML =
    `<div class="card"><div class="t">🟢 AL</div><div class="v up">${alSay}</div></div>` +
    `<div class="card"><div class="t">🟡 TUT</div><div class="v" style="color:var(--tx2)">${tutSay}</div></div>` +
    `<div class="card"><div class="t">🔴 SAT</div><div class="v down">${satSay}</div></div>` +
    `<div class="card"><div class="t">⚪ İZLE</div><div class="v" style="color:var(--tx2)">${izleSay}</div></div>` +
    `<div class="card"><div class="t">⚠️ RİSKLİ</div><div class="v down">${riskliSay}</div></div>` +
    `<div class="card"><div class="t">📊 Analiz</div><div class="v">${s.toplam}${durumEtiket}</div></div>`;

  const m = d.makro || {};
  let mk = '';
  Object.values(m.fiyatlar || {}).forEach(f => {
    // ters: VIX gibi endekslerde artış negatiftir (korku) → renk ters
    const ts = f.ters ? -1 : 1;
    const renk = f.degisim == null ? '' : ((f.degisim * ts) >= 0 ? 'up' : 'down');
    // gram altın uyarısı: borsapy çapraz değeri ile hesap arasında >%11 fark
    const gramUyari = f.uyari ? ' <span class="up" title="borsapy çapraz: ' + fmt(f.capraz) +
      ' · fark %' + fmt(f.fark_yuzde) + '">[1]</span>' : '';
    mk += `<div class="mk"><div class="t">${f.ad}${gramUyari}</div><div class="v">${fmt(f.fiyat)}</div>` +
          `<div class="d ${renk}">${f.degisim == null ? f.birim : yuzde(f.degisim)}</div></div>`;
  });
  document.getElementById('makroRow').innerHTML = mk;

  let tcmb = '';
  if (m.faiz && m.faiz.faiz) {
    const reel = m.faiz.faiz - (m.tufe ? m.tufe.yillik : 0);
    const yorum = reel > 0 ? 'POZİTİF reel faiz → altına baskı, TL mevduat cazip' : 'NEGATİF reel faiz → altın/döviz talebi güçlü';
    const karar = m.faiz.karar_tarihi ? `Karar ${m.faiz.karar_tarihi} · uygulama ${m.faiz.tarih}` : `Tarih ${m.faiz.tarih}`;
    tcmb = `<h2>🏛️ Merkez Bankası</h2><div class="tcmb">Politika faizi <b>%${m.faiz.faiz.toFixed(2)}</b> (${karar}) · ` +
           `TÜFE yıllık <b>%${m.tufe ? m.tufe.yillik.toFixed(2) : '?'}</b> · Reel faiz <b class="${ok(reel)}">%${reel >= 0 ? '+' : ''}${reel.toFixed(2)}</b> → ${yorum}</div>`;
  }

  let html = tcmb;
  // 5 — Gece analizi (kompakt, daraltılabilir)
  const g = d.gece_analizi;
  if (g) {
    const chip = (liste, renk, alan) => liste.length
      ? '<div class="chips">' + liste.map(x => `<span class="chip"><b style="color:${renk}">${x.sembol}</b> ${fmt(x.fiyat)} <span class="r">${alan === 'rsi' ? 'RSI ' + fmt(x.rsi,0) : 'skor ' + (x.skor>0?'+':'') + x.skor}</span></span>`).join('') + '</div>'
      : '<div class="empty" style="padding:4px 0">Yok</div>';
    html += `<details class="gece"><summary>🌙 Gece Analizi · Yarın İçin <span class="cnt">${g.tarih || ''}</span><span class="ic">▾ aç/kapa</span></summary><div class="ic-body">` +
      `<div class="k">💪 En Güçlü AL Adayları (skor ≥ 3)</div>${chip(g.guclu_al || [], 'var(--up)', 'skor')}` +
      `<div class="k">⚠️ En Zayıf SAT Adayları (skor ≤ -3)</div>${chip(g.zayif_sat || [], 'var(--down)', 'skor')}` +
      `<div class="k">🧲 Bollinger Sıkışma (kırılım izlenecek)</div>${chip((g.squeeze || []).map(x=>({sembol:x.sembol, fiyat:x.fiyat, skor:0})), 'var(--warn)', 'skor')}` +
      `<div class="k">🔵 Aşırı Satım (RSI &lt; 30)</div>${chip((g.asiri_satim || []).map(x=>({sembol:x.sembol, fiyat:x.fiyat, rsi:x.rsi})), 'var(--info)', 'rsi')}` +
      `<div class="k">📅 Yarının Yüksek Önemli Olayları</div>` +
      ((g.yarin_yuksek_onem || []).length
        ? '<div class="chips">' + g.yarin_yuksek_onem.map(o => `<span class="chip"><b class="hi">${o.saat || ''}</b> ${o.ulke || ''} · ${o.olay}</span>`).join('') + '</div>'
        : '<div class="empty" style="padding:4px 0">Yarın için yüksek önemli olay yok</div>') +
      `</div></details>`;
  }

  // 3+6 — Portföy + alarmlar
  html += genislikHtml(d.genislik);
  html += portfoyHtml();

  html += `<div class="toolbar">
    <input id="arama" type="search" placeholder="🔍 Hisse ara (örn. THYAO)…" oninput="filtrele()">
    <select id="fSinyal" onchange="filtrele()">
      <option value="">Sinyal: Tümü</option>
      <option value="AL">AL</option><option value="DİKKAT_AL">DİKKAT AL</option>
      <option value="TUT">TUT</option><option value="DİKKAT_SAT">DİKKAT SAT</option>
      <option value="SAT">SAT</option>
      <option value="IZLE">İZLE (filtre)</option><option value="RISKLI">RİSKLİ</option>
    </select>
    <select id="fTrend" onchange="filtrele()">
      <option value="">Trend: Tümü</option>
      <option value="YUKARI">YUKARI</option><option value="YATAY">YATAY</option><option value="AŞAĞI">AŞAĞI</option>
    </select>
    <select id="fSqueeze" onchange="filtrele()">
      <option value="">Squeeze: Tümü</option>
      <option value="SIKIŞMA">🧲 SIKIŞMA</option><option value="KIRILIM">🚀 KIRILIM</option>
    </select>
    <button class="btn" onclick="csvIndir()">⬇ CSV</button>
  </div>`;

  html += tabloBolum('AL ADAYLARI', '🟢', s.al || []);
  html += tabloBolum('İZLEME / TUT', '🟡', s.tut || []);
  html += tabloBolum('SAT / DİKKAT', '🔴', s.sat || []);
  // G05 — filtreye takılanlar ayrı bölümde (md.2 likidite, md.5 tedbir, md.6 sorunlu hisse)
  if ((s.izle || []).length) html += tabloBolum('FİLTRE — İZLE', '⚪', s.izle || []);
  if ((s.riskli || []).length) html += tabloBolum('RİSKLİ — SORUNLU HİSSE', '⚠️', s.riskli || []);

  html += '<div class="note">' +
    (s.toplam ? `📊 ${s.toplam} hisse analiz edildi · veri ${s.al && s.al[0] && s.al[0].tarih ? s.al[0].tarih : ''} ${s.al && s.al[0] ? tazelik(s.al[0].tarih) : ''} · ` : '') +
    'Yatırım tavsiyesi değildir. Sinyaller teknik indikatör kombinasyonlarıdır.</div>';
  document.getElementById('sec-piyasa').innerHTML = html;
  durum.detay = new Map();
  document.querySelectorAll('#sec-piyasa tbody tr[data-sym]').forEach(tr => {
    tr.addEventListener('click', () => {
      const sym = tr.dataset.sym;
      const det = document.querySelector(`tr.detail[data-det="${sym}"]`);
      if (det) det.style.display = det.style.display === 'none' ? '' : 'none';
    });
  });
}

/* ══════════ FİLTRE ══════════ */
function filtrele() {
  const q = (document.getElementById('arama').value || '').toUpperCase().trim();
  const fs = document.getElementById('fSinyal').value;
  const ft = document.getElementById('fTrend').value;
  const fq = document.getElementById('fSqueeze').value;
  document.querySelectorAll('#sec-piyasa tbody tr[data-sym]').forEach(tr => {
    const sym = tr.dataset.sym;
    const r = PIYASA_VERI && [...(PIYASA_VERI.sinyaller.al||[]), ...(PIYASA_VERI.sinyaller.tut||[]), ...(PIYASA_VERI.sinyaller.sat||[]), ...(PIYASA_VERI.sinyaller.izle||[]), ...(PIYASA_VERI.sinyaller.riskli||[])].find(x => x.sembol === sym);
    if (!r) return;
    const okS = !fs || r.sinyal === fs;
    const okT = !ft || r.trend === ft;
    const okQ = !fq || (fq === 'SIKIŞMA' ? (r.squeeze||'').toUpperCase().includes('SIKIŞMA') : (r.squeeze||'').toUpperCase().includes('KIRILIM'));
    const okA = !q || sym.includes(q);
    tr.style.display = (okS && okT && okQ && okA) ? '' : 'none';
    const det = document.querySelector(`tr.detail[data-det="${sym}"]`);
    if (det) det.style.display = 'none';
  });
}

/* ══════════ CSV ══════════ */
function csvIndir() {
  const d = PIYASA_VERI; if (!d) return;
  const satirlar = [...(d.sinyaller.al||[]), ...(d.sinyaller.tut||[]), ...(d.sinyaller.sat||[]), ...(d.sinyaller.izle||[]), ...(d.sinyaller.riskli||[])];
  const baslik = 'Hisse,Fiyat,1A%,RS20,RS60,HacimOran,VOL20,ZirveUzak,TrendATR,Skor,Sinyal,Trend,Para,RSI,MFI,Squeeze,S1,R1,Stop,Hedef,Kilit,IpoYeni,Riskli,LikiditeTL,Filtre';
  const csv = [baslik, ...satirlar.map(r =>
    [r.sembol, r.fiyat, r.ay_oncesi ?? '', r.RS20 ?? '', r.RS60 ?? '', r.HACIM_ORAN ?? '', r.VOL20 ?? '',
     r.ZIRVE_UZAK ?? '', r.TREND_ATR ?? '', r.skor, r.sinyal, r.trend, r.para, r.rsi, r.mfi,
     r.squeeze, r.s1 ?? '', r.r1 ?? '', r.stop ?? '', r.hedef ?? '',
     r.kilit ?? '', r.ipo_yeni ? 'EVET' : '', r.riskli ?? '',
     r.likidite_tl == null ? '' : Math.round(r.likidite_tl), r.filtre ?? ''].join(','))].join('\n');
  const blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bist-panel-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

/* ══════════ PORTFÖY + ALARMLAR (3+6) ══════════ */
function portfoyOku() { try { return JSON.parse(localStorage.getItem('bist_panel_portfoy') || '{}'); } catch(e) { return {}; } }
function portfoyKaydet(p) { localStorage.setItem('bist_panel_portfoy', JSON.stringify(p)); }
function fiyatBul(sym) {
  if (!PIYASA_VERI) return null;
  const hepsi = [...(PIYASA_VERI.sinyaller.al||[]), ...(PIYASA_VERI.sinyaller.tut||[]), ...(PIYASA_VERI.sinyaller.sat||[])];
  const r = hepsi.find(x => x.sembol === sym);
  return r ? r.fiyat : null;
}
function bildirimIzni() {
  if (!('Notification' in window)) return alert('Bu tarayıcı bildirim desteklemiyor');
  Notification.requestPermission().then(p => {
    const el = document.getElementById('bildirimDurum');
    if (el) el.textContent = p === 'granted' ? '✅ Bildirim açık' : '⛔ Bildirim kapalı';
  });
}
function bildirim(ad, mesaj) {
  if ('Notification' in window && Notification.permission === 'granted' && !document.hidden) {
    try {
      new Notification(ad, { body: mesaj, icon: 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>' });
    } catch(e) {}
  }
}
function portfoyHtml() {
  const p = portfoyOku();
  const semboller = Object.keys(p);
  let toplamMaliyet = 0, toplamDeger = 0, toplamKar = 0;
  let satirlar = '';
  semboller.forEach(sym => {
    const k = p[sym];
    const adet = k.adet, maliyet = k.maliyet;
    const fiyat = fiyatBul(sym);
    toplamMaliyet += adet * maliyet;
    if (fiyat) { toplamDeger += adet * fiyat; toplamKar += (fiyat - maliyet) * adet; }
    const kar = fiyat ? (fiyat - maliyet) * adet : null;
    const alarm = (k.hedef || k.stop)
      ? `<span style="font-size:10px;color:var(--tx2)">🎯${k.hedef ? fmt(k.hedef) : '—'} 🛑${k.stop ? fmt(k.stop) : '—'}</span>`
      : '';
    satirlar += `<div class="pf-row"><span class="sym">${sym}</span>` +
      `<span>${adet} adet @ ${fmt(maliyet)}</span>` +
      `<span>Güncel: <b>${fiyat ? fmt(fiyat) : '—'}</b></span>` +
      `<span class="${ok(kar)}">${kar == null ? '—' : (kar >= 0 ? '+' : '') + fmt(kar,0) + ' TL'}</span>` +
      alarm +
      ((k.hedef || k.stop) ? `<button class="sifirla" onclick="alarmSifirla('${sym}')" title="Alarmı sıfırla">↺</button>` : '') +
      `<button class="sil" onclick="portfoySil('${sym}')">✕</button></div>`;
  });
  const kar = toplamKar;
  const bd = ('Notification' in window) ? (Notification.permission === 'granted' ? '✅ Bildirim açık' : '⛔ Kapalı') : '—';
  return `<div class="portfoy"><div class="top">💼 <b>Portföyüm</b>` +
    (semboller.length ? `<span class="o ${ok(kar)}">${kar >= 0 ? '+' : ''}${fmt(kar,0)} TL</span>` +
      `<span style="color:var(--tx2);font-size:10.5px">maliyet ${fmt(toplamMaliyet,0)} · değer ${fmt(toplamDeger,0)}</span>` : '') +
    `<button class="btn" style="margin-left:auto;padding:5px 10px;font-size:11px" onclick="bildirimIzni()">🔔 <span id="bildirimDurum">${bd}</span></button></div>` +
    (semboller.length ? satirlar : '<div class="empty" style="padding:6px 0">Portföy boş — aşağıdan hisse ekle</div>') +
    `<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">` +
    `<input id="pfSym" placeholder="HISSE" style="width:76px" maxlength="10">` +
    `<input id="pfAdet" type="number" placeholder="Adet" style="width:64px" min="1">` +
    `<input id="pfMaliyet" type="number" placeholder="Maliyet TL" style="width:92px" min="0" step="0.01">` +
    `<input id="pfHedef" type="number" placeholder="🎯 Hedef" style="width:80px" min="0" step="0.01">` +
    `<input id="pfStop" type="number" placeholder="🛑 Stop" style="width:80px" min="0" step="0.01">` +
    `<button class="btn" onclick="portfoyEkle()">＋ Ekle</button></div>` +
    `<div class="note">Hedef/stop girersen eşik aşıldığında tarayıcı bildirimi alırsın (sayfa açıkken 15 dk'da bir kontrol). Sadece bu cihazda saklanır.</div></div>`;
}
function portfoyEkle() {
  const sym = (document.getElementById('pfSym').value || '').toUpperCase().trim();
  const adet = parseFloat(document.getElementById('pfAdet').value);
  const maliyet = parseFloat(document.getElementById('pfMaliyet').value);
  const hedef = parseFloat(document.getElementById('pfHedef').value) || null;
  const stop = parseFloat(document.getElementById('pfStop').value) || null;
  if (!sym || !adet || !maliyet) return;
  const p = portfoyOku();
  p[sym] = { adet, maliyet, hedef, stop, tetik_hedef: false, tetik_stop: false };
  portfoyKaydet(p);
  renderPiyasa(PIYASA_VERI);
}
function portfoySil(sym) {
  const p = portfoyOku();
  delete p[sym];
  portfoyKaydet(p);
  renderPiyasa(PIYASA_VERI);
}
function alarmSifirla(sym) {
  const p = portfoyOku();
  if (p[sym]) { p[sym].tetik_hedef = false; p[sym].tetik_stop = false; }
  portfoyKaydet(p);
  renderPiyasa(PIYASA_VERI);
}
function alarmKontrol() {
  if (!PIYASA_VERI) return;
  const p = portfoyOku();
  let mesajlar = [];
  Object.keys(p).forEach(sym => {
    const k = p[sym];
    if (!k.hedef && !k.stop) return;
    const fiyat = fiyatBul(sym);
    if (fiyat == null) return;
    if (k.hedef && fiyat >= k.hedef && !k.tetik_hedef) {
      k.tetik_hedef = true;
      mesajlar.push(`🎯 ${sym} hedefe ulaştı: ${fmt(fiyat)} TL (hedef ${fmt(k.hedef)})`);
    }
    if (k.stop && fiyat <= k.stop && !k.tetik_stop) {
      k.tetik_stop = true;
      mesajlar.push(`🛑 ${sym} stop'a düştü: ${fmt(fiyat)} TL (stop ${fmt(k.stop)})`);
    }
  });
  if (mesajlar.length) {
    portfoyKaydet(p);
    mesajlar.forEach(m => bildirim('BIST Panel Alarm', m));
  }
}

/* ══════════ KARNE — Risk/Pozisyon Hesaplayıcı + Sinyal Karnesi ══════════ */
let KARNE_KURULDU = false;

function riskHesapKur(d) {
  const el = document.getElementById('karne-hesap');
  if (!el || KARNE_KURULDU) return;
  const s = d.sinyaller || {};
  const liste = [].concat(s.al || [], s.sat || [], s.tut || []);
  window.__RISK = liste;
  const opt = liste.map(x => `<option value="${x.sembol}">${x.sembol} · ${fmt(x.fiyat)} TL · ${(x.sinyal||'').replace('DİKKAT_','')}</option>`).join('');
  el.innerHTML =
    '<h2>🧮 Risk / Pozisyon Hesaplayıcı <span class="cnt">kaç lot · ne kadar risk</span></h2>' +
    '<div class="portfoy" style="margin-top:0">' +
      '<div class="top"><span style="font-size:12px;color:var(--tx2)">Sermaye (TL)</span>' +
        '<input id="rhSermaye" type="number" value="100000" min="0" step="1000" oninput="riskHesapla()" style="width:100px">' +
        '<span style="font-size:12px;color:var(--tx2)">Risk %</span>' +
        '<input id="rhRisk" type="number" value="1.5" min="0.1" max="10" step="0.1" oninput="riskHesapla()" style="width:64px">' +
        '<span style="font-size:12px;color:var(--tx2)">Stop %</span>' +
        '<input id="rhStopYuzde" type="number" value="8" min="0.5" max="50" step="0.5" oninput="riskStopYuzde()" style="width:64px"></div>' +
      '<div class="top"><select id="rhSembol" onchange="riskDoldur()" style="background:var(--bg3);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 9px;font-size:12px;flex:1;min-width:150px">' +
        '<option value="">— sinyalden hisse seç —</option>' + opt + '</select></div>' +
      '<div class="top"><span style="font-size:12px;color:var(--tx2)">Giriş</span>' +
        '<input id="rhGiris" type="number" step="0.01" oninput="riskHesapla()" style="width:90px">' +
        '<span style="font-size:12px;color:var(--tx2)">Stop</span>' +
        '<input id="rhStop" type="number" step="0.01" oninput="riskHesapla()" style="width:90px"></div>' +
      '<div id="rhSonuc" style="margin-top:10px"></div>' +
    '</div>';
  KARNE_KURULDU = true;
  riskHesapla();
}

function riskDoldur() {
  const sel = document.getElementById('rhSembol');
  const s = (window.__RISK || []).find(x => x.sembol === sel.value);
  if (!s) return;
  const st = s.stop != null ? s.stop : Math.round(s.fiyat * 0.92 * 100) / 100;
  document.getElementById('rhGiris').value = s.fiyat;
  document.getElementById('rhStop').value = st;
  document.getElementById('rhStopYuzde').value = Math.round(Math.abs(s.fiyat - st) / s.fiyat * 1000) / 10;
  riskHesapla();
}

function riskStopYuzde() {
  const g = +document.getElementById('rhGiris').value || 0;
  const y = +document.getElementById('rhStopYuzde').value || 0;
  if (!g) return;
  document.getElementById('rhStop').value = Math.round(g * (1 - y / 100) * 100) / 100;
  riskHesapla();
}

function riskHesapla() {
  const S = +document.getElementById('rhSermaye').value || 0;
  const r = +document.getElementById('rhRisk').value || 0;
  const G = +document.getElementById('rhGiris').value || 0;
  const St = +document.getElementById('rhStop').value || 0;
  const out = document.getElementById('rhSonuc');
  if (!out) return;
  if (!S || !G || !St || G === St) { out.innerHTML = '<div class="note">Sermaye, giriş ve stop gir — ya da yukarıdan sinyal seç.</div>'; return; }
  const riskTL = S * r / 100, mesafe = Math.abs(G - St), mesafeY = mesafe / G * 100;
  const lot = Math.floor(riskTL / mesafe), pozTL = lot * G, pozY = pozTL / S * 100;
  const long = G > St, yon = long ? 'LONG' : 'SHORT';
  const hedef = k => long ? G + k * mesafe : G - k * mesafe;
  const asiri = pozTL > S;
  out.innerHTML =
    '<div class="scn">' +
      `<div class="sc"><div class="t">Riske Edilen</div><div class="o down">${fmt(riskTL,0)} TL</div><div class="m">sermayenin %${r}</div></div>` +
      `<div class="sc"><div class="t">Alınacak Lot</div><div class="o">${fmt(lot,0)}</div><div class="m">${yon} · stop %${mesafeY.toFixed(1)}</div></div>` +
      `<div class="sc"><div class="t">Pozisyon Tutarı</div><div class="o"${asiri?' style="color:var(--warn)"':''}>${fmt(pozTL,0)} TL</div><div class="m">sermayenin %${pozY.toFixed(0)}</div></div>` +
      `<div class="sc"><div class="t">Lot Başı Risk</div><div class="o">${fmt(mesafe,2)} TL</div><div class="m">giriş − stop</div></div>` +
    '</div>' +
    '<div class="twrap"><table><tr><th>Hedef</th><th>Fiyat</th><th>Kâr</th><th>R:R</th></tr><tbody>' +
      [1,2,3].map(k => `<tr><td>${k}R</td><td class="sym">${fmt(hedef(k))}</td><td class="up">+${fmt(lot*(hedef(k)-G),0)} TL</td><td>1:${k}</td></tr>`).join('') +
    '</tbody></table></div>' +
    `<div class="note">Lot = (Sermaye × Risk%) ÷ |Giriş − Stop|. Giriş ${fmt(G)} · Stop ${fmt(St)}. ` +
    (asiri ? '⚠️ Pozisyon sermayeni aşıyor — stop\'u sık veya risk yüzdesini düşür.' : 'Pozisyon sermaye içinde ✓') + '</div>';
}

function karnePerformans(d) {
  const sg = d.sinyal_gecmisi;
  if (!sg || !sg.kayitlar || !sg.kayitlar.length)
    return '<h2>🎯 Sinyal Performans Karnesi</h2><div class="empty">Karne veri topluyor — sinyal geçmişi biriktikçe başarı ve ortalama getiri burada görünecek.</div>';
  const k = sg.kayitlar, get = x => x.getiri == null ? 0 : x.getiri;
  const poz = k.filter(x => get(x) > 0).length, neg = k.filter(x => get(x) < 0).length;
  const ort = k.reduce((a, x) => a + get(x), 0) / k.length;
  const sirali = [...k].sort((a, b) => get(b) - get(a));
  const enIyi = sirali[0], enKotu = sirali[sirali.length - 1];
  const alt = k.filter(x => (x.sinyal || '').includes('AL')), satL = k.filter(x => (x.sinyal || '').includes('SAT'));
  const oo = a => a.length ? a.reduce((s, x) => s + get(x), 0) / a.length : null;
  const bo = a => a.length ? Math.round(a.filter(x => get(x) > 0).length / a.length * 100) : null;
  const oran = Math.round(poz / k.length * 100);
  const renk = ort >= 0 ? 'var(--up)' : 'var(--down)';
  let h = '<h2>🎯 Sinyal Performans Karnesi <span class="cnt">' + k.length + ' sinyal · %' + (sg.basari_orani ?? oran) + ' başarı</span></h2>' +
    '<div class="scn">' +
      `<div class="sc"><div class="t">Başarı Oranı</div><div class="o" style="color:${renk}">%${sg.basari_orani ?? oran}</div><div class="m">🟢 ${poz} · 🔴 ${neg}</div></div>` +
      `<div class="sc"><div class="t">Ort. Getiri</div><div class="o" style="color:${renk}">${ort >= 0 ? '+' : ''}%${ort.toFixed(2)}</div><div class="m">sinyal başına</div></div>` +
      `<div class="sc"><div class="t">En İyi Sinyal</div><div class="o up">${enIyi.sembol}</div><div class="m">+%${get(enIyi).toFixed(1)} · ${enIyi.tarih}</div></div>` +
      `<div class="sc"><div class="t">En Kötü Sinyal</div><div class="o down">${enKotu.sembol}</div><div class="m">%${get(enKotu).toFixed(1)} · ${enKotu.tarih}</div></div>` +
    '</div>' +
    '<div class="twrap"><table><tr><th>Sinyal</th><th>Adet</th><th>Başarı</th><th>Ort. Getiri</th></tr><tbody>' +
      `<tr><td class="sym">AL</td><td>${alt.length}</td><td>${bo(alt) == null ? '—' : '%' + bo(alt)}</td><td class="${ok(oo(alt))}">${oo(alt) == null ? '—' : (oo(alt) >= 0 ? '+' : '') + '%' + oo(alt).toFixed(2)}</td></tr>` +
      `<tr><td class="sym">SAT</td><td>${satL.length}</td><td>${bo(satL) == null ? '—' : '%' + bo(satL)}</td><td class="${ok(oo(satL))}">${oo(satL) == null ? '—' : (oo(satL) >= 0 ? '+' : '') + '%' + oo(satL).toFixed(2)}</td></tr>` +
    '</tbody></table></div>' +
    '<h2>📋 Son Sinyaller</h2><div class="twrap"><table><tr><th>Tarih</th><th>Hisse</th><th>Sinyal</th><th>Skor</th><th>Giriş</th><th>Güncel</th><th>Getiri</th></tr><tbody>';
  [...k].reverse().slice(0, 15).forEach(x => {
    h += `<tr><td>${x.tarih || ''}</td><td class="sym">${x.sembol}</td><td>${badge(x.sinyal)}</td>` +
      `<td style="color:${x.skor >= 3 ? 'var(--up)' : x.skor <= -3 ? 'var(--down)' : 'var(--warn)'}">${x.skor > 0 ? '+' : ''}${x.skor}</td>` +
      `<td>${fmt(x.giris)}</td><td>${x.guncel == null ? '—' : fmt(x.guncel)}</td>` +
      `<td class="${ok(x.getiri)}">${x.getiri == null ? '—' : yuzde(x.getiri)}</td></tr>`;
  });
  h += '</tbody></table></div><div class="note">Getiri = sinyal günü kapanış → bugünkü fiyat. Gerçek veri; sinyal sayısı arttıkça karne anlam kazanır.</div>';
  return h;
}

function renderSenaryo(d) {
  riskHesapKur(d);
  const t = d.test_senaryolari;
  let html = karnePerformans(d);
  if (t) {
    html += '<h2>🧪 Simülasyon — 6 Aylık Gerçek Veri · 💵 100K TL</h2><div class="scn">';
    const karti = (s, sermaye, acik) => {
      if (!s) return;
      const renk = s.ortalama >= 0 ? 'var(--up)' : 'var(--down)';
      const poz = Math.max(0, Math.min(100, 50 + s.ortalama * 2));
      const basari = s.islem ? Math.round(s.kazanan / s.islem * 100) : 0;
      const kb = s.islem ? `<div class="bar"><i style="width:${basari}%;background:var(--up)"></i><i style="width:${100-basari}%;background:var(--down)"></i></div>` : '';
      const tl = sermaye ? `<div class="m">💵 <b>100K TL ile: ${fmt(sermaye.sonuc,0)} TL</b> <span class="${ok(sermaye.kar_zarar)}">(${sermaye.kar_zarar >= 0 ? '+' : ''}${fmt(sermaye.kar_zarar,0)} TL)</span> · ${fmt(sermaye.tahsis,0)} TL/pozisyon</div>` : '';
      html += `<div class="sc ${acik?'wide':''}"><div class="t">${s.ad}</div>` +
        `<div class="o" style="color:${renk}">${s.ortalama >= 0 ? '+' : ''}%${s.ortalama.toFixed(1)}</div>` +
        `<div class="bar"><i style="width:${poz}%;background:${s.ortalama>=0?'var(--up)':'var(--down)'}"></i></div>` +
        `<div class="m">${s.islem} işlem · 🟢 ${s.kazanan} · 🔴 ${s.kaybeden} · <b>%${basari} başarı</b></div>` + kb + tl;
      if (s.en_iyi) html += `<div class="m">🏆 ${s.en_iyi.sembol} %${s.en_iyi.getiri_yuzde >= 0 ? '+' : ''}${s.en_iyi.getiri_yuzde} (${s.en_iyi.tarih})</div>`;
      if (s.en_kotu) html += `<div class="m">💀 ${s.en_kotu.sembol} %${s.en_kotu.getiri_yuzde >= 0 ? '+' : ''}${s.en_kotu.getiri_yuzde} (${s.en_kotu.tarih})</div>`;
      html += '</div>';
    };
    const sm = t.sermaye || {};
    karti(t.pazartesi_acilis, sm.pazartesi);
    karti(t.ertesi_gun_acilis, sm.ertesi);
    karti(t.stop_losslu, sm.stop, true);
    html += '</div><div class="note">' + (t.aciklama || '') + '</div>';

    // G08 — XU100'e göre alfa + işlem metrikleri (eski alanlar üstte korunuyor)
    if (t.metrik) {
      const m = t.metrik;
      const af = v => v == null ? '—' : (v >= 0 ? '+' : '') + '%' + v.toFixed(1);
      const afK = v => v == null ? '' : (v >= 0 ? 'up' : 'down');
      html += '<h2>📐 Performans — XU100\'e göre <span class="cnt">' + m.islem + ' işlem</span></h2><div class="scn">' +
        `<div class="sc"><div class="t">Ortalama Alfa (XU100'e göre)</div><div class="o ${afK(m.ortalama_alfa)}">${af(m.ortalama_alfa)}</div><div class="m">işlem başına, endeks fazlası</div></div>` +
        `<div class="sc"><div class="t">İşlem Getirisi</div><div class="o ${m.ortalama >= 0 ? 'up' : 'down'}">${af(m.ortalama)}</div><div class="m">maliyet düşülmüş, işlem başına</div></div>` +
        `<div class="sc"><div class="t">İsabet</div><div class="o">%${m.isabet == null ? '—' : (m.isabet * 100).toFixed(1)}</div><div class="m">${m.islem} işlem</div></div>` +
        `<div class="sc"><div class="t">Profit Factor</div><div class="o ${(m.profit_factor ?? 0) >= 1 ? 'up' : 'down'}">${m.profit_factor == null ? '—' : m.profit_factor.toFixed(2)}</div><div class="m">kâr / zarar</div></div>` +
        `<div class="sc"><div class="t">Gerçekleşen Max Düşüş (100K)</div><div class="o down">${m.max_drawdown == null ? '—' : '%' + m.max_drawdown.toFixed(1)}</div><div class="m">kronolojik simülasyon, açık pozisyonlar maliyetten</div></div>` +
        `<div class="sc"><div class="t">Devir</div><div class="o">${m.devir == null ? '—' : m.devir.toFixed(0)}</div><div class="m">yıllık işlem / pozisyon</div></div>` +
        '</div>';

      if (t.skor_tablosu && t.skor_tablosu.length) {
        html += '<h2>🎚️ Skor Seviyesine Göre <span class="cnt">XU100\'e göre alfa</span></h2><div class="twrap"><table><tr>' +
          '<th>Skor</th><th>İşlem</th><th>İsabet</th><th>Ort. Getiri</th><th>Ort. Alfa (XU100\'e göre)</th><th>Profit Factor</th><th>Gerçekleşen Max DD</th></tr><tbody>';
        t.skor_tablosu.forEach(r => {
          html += `<tr><td class="sym">${r.skor}</td><td>${r.islem}</td>` +
            `<td>${r.isabet == null ? '—' : '%' + (r.isabet * 100).toFixed(1)}</td>` +
            `<td class="${r.ortalama >= 0 ? 'up' : 'down'}">${af(r.ortalama)}</td>` +
            `<td class="${afK(r.ortalama_alfa)}">${af(r.ortalama_alfa)}</td>` +
            `<td>${r.profit_factor == null ? '—' : r.profit_factor.toFixed(2)}</td>` +
            `<td class="down">${r.max_drawdown == null ? '—' : '%' + r.max_drawdown.toFixed(1)}</td></tr>`;
        });
        html += '</tbody></table></div>';
      }
      if (t.parametre) {
        const p = t.parametre;
        html += `<div class="note">Parametreler: maliyet %${(p.maliyet * 100).toFixed(2)} (gidiş-dönüş) · vade ${(p.vade_gun || []).join('/')} iş günü · stop ${p.atr_stop}×ATR · hedef ${p.atr_hedef}×ATR · ${fmt(p.sermaye, 0)} TL · max ${p.max_pozisyon} pozisyon · benchmark ${p.benchmark}</div>`;
      }
    }

    // Hisse bazlı backtest
    if (t.hisse_bazli && t.hisse_bazli.length) {
      html += '<h2>📈 Hisse Bazlı Backtest <span class="cnt">sinyal başına</span></h2><div class="twrap"><table><tr>' +
        '<th>Hisse</th><th>Toplam Getiri</th><th>İşlem</th><th>Başarı</th><th>En Kötü İşlem</th></tr><tbody>';
      t.hisse_bazli.forEach(x => {
        // en_kotu_islem yeni ad; eski 'max_dusus' bir sürüm boyunca yedek
        const ek = x.en_kotu_islem != null ? x.en_kotu_islem : x.max_dusus;
        html += `<tr><td class="sym">${x.sembol}</td>` +
          `<td class="${ok(x.toplam_getiri)}">${x.toplam_getiri >= 0 ? '+' : ''}%${x.toplam_getiri.toFixed(1)}</td>` +
          `<td>${x.islem_sayisi}</td><td>%${x.basari_orani}</td>` +
          `<td class="${ek >= 0 ? 'up' : 'down'}">${ek == null ? '—' : (ek >= 0 ? '+' : '') + '%' + ek.toFixed(1)}</td></tr>`;
      });
      html += '</tbody></table></div>';
    }

    const ilk = (t.ertesi_gun_acilis && t.ertesi_gun_acilis.islemler) || [];
    if (ilk.length) {
      // G08 — işlemler artık vade/stop/hedef ile kapanıyor: çıkış tarihi + neden gösterilir.
      // Eski alanlar (bugun, getiri_yuzde) korunur; çıkış yoksa 'Bugün' kolonuna düşülür.
      html += '<h2>🏆 En Kârlı İşlemler (son 6 ay)</h2><div class="twrap"><table><tr>' +
        '<th>Hisse</th><th>Sinyal</th><th>Giriş</th><th>Çıkış</th><th>Neden</th><th>Getiri</th>' +
        '<th title="Aynı tarihlerde XU100 getirisi düşülmüş">Alfa (XU100\'e göre)</th></tr><tbody>';
      ilk.slice(0, 10).forEach(x => {
        const cikis = x.cikis_tarih || (x.bugun != null ? 'açık' : '—');
        const neden = x.cikis_neden === 'stop' ? '🛑 stop' : x.cikis_neden === 'hedef' ? '🎯 hedef' : x.cikis_neden === 'vade' ? '⏱ vade' : '—';
        const alfa = x.alfa_yuzde == null ? '—' : (x.alfa_yuzde >= 0 ? '+' : '') + '%' + x.alfa_yuzde.toFixed(1);
        html += `<tr><td class="sym">${x.sembol}</td><td>${x.sinyal_tarih}</td><td>${fmt(x.giris)}</td>` +
          `<td>${cikis}</td><td>${neden}</td><td class="${ok(x.getiri_yuzde)}">${yuzde(x.getiri_yuzde)}</td>` +
          `<td class="${x.alfa_yuzde == null ? '' : (x.alfa_yuzde >= 0 ? 'up' : 'down')}">${alfa}</td></tr>`;
      });
      html += '</tbody></table></div>';
    }
  }
  const hedefEl = document.getElementById('karne-icerik');
  if (hedefEl) hedefEl.innerHTML = html;
}

/* ══════════ HABER (Cryptopanic tarzı: kategori + dil + yön filtreleri, zaman damgası) ══════════ */
const KAT_AD = {'bist':'📊 BIST','altin-maden':'🥇 Altın/Maden','makro':'🏛️ Makro','global':'🌍 Global'};
let haberFiltre = { kategori: '', dil: '', yon: '' };

function zamanGecmis(iso) {
  if (!iso) return '';
  const t = utcTarih(iso).getTime();
  if (isNaN(t)) return '';
  const dk = Math.floor((Date.now() - t) / 60000);
  if (dk < 1) return 'az önce';
  if (dk < 60) return dk + ' dk önce';
  const sa = Math.floor(dk / 60);
  if (sa < 24) return sa + ' saat önce';
  const gn = Math.floor(sa / 24);
  if (gn < 30) return gn + ' gün önce';
  return Math.floor(gn / 30) + ' ay önce';
}

function haberFiltrele(k, v) {
  if (haberFiltre[k] === v) haberFiltre[k] = '';
  else haberFiltre[k] = v;
  renderHaber(PIYASA_VERI);
}

function chip(k, v, etiket, aktifRenk) {
  const aktif = haberFiltre[k] === v;
  return `<button class="chip ${aktif ? 'active' : ''}" style="${aktif ? 'border-color:' + aktifRenk + ';color:' + aktifRenk + ';font-weight:700' : ''}" onclick="haberFiltrele('${k}','${v}')">${etiket}</button>`;
}

function renderHaber(d) {
  const hb = d.haberler || [];
  let html = '<h2>📰 Haber Akışı <span class="cnt">' + hb.length + ' haber · 7 gün</span></h2>';
  html += '<div class="chips">' +
    chip('dil', 'tr', '🇹🇷 Türkçe', 'var(--info)') +
    chip('dil', 'en', '🇬🇧 İngilizce', 'var(--info)') +
    chip('kategori', 'bist', '📊 BIST', 'var(--up)') +
    chip('kategori', 'altin-maden', '🥇 Altın/Maden', 'var(--warn)') +
    chip('kategori', 'makro', '🏛️ Makro', 'var(--info)') +
    chip('kategori', 'global', '🌍 Global', 'var(--accent)') +
    chip('yon', 'pozitif', '🟢 Pozitif', 'var(--up)') +
    chip('yon', 'negatif', '🔴 Negatif', 'var(--down)') +
    (Object.values(haberFiltre).some(Boolean) ? `<button class="chip" onclick="haberFiltre={kategori:'',dil:'',yon:''};renderHaber(PIYASA_VERI)">✕ Temizle</button>` : '') +
    '</div>';

  const filtreli = hb.filter(h =>
    (!haberFiltre.kategori || h.kategori === haberFiltre.kategori) &&
    (!haberFiltre.dil || h.dil === haberFiltre.dil) &&
    (!haberFiltre.yon || h.yon === haberFiltre.yon)
  );

  if (filtreli.length) {
    filtreli.forEach(h => {
      const cls = h.yon === 'pozitif' ? 'b-AL' : (h.yon === 'negatif' ? 'b-SAT' : 'b-TUT');
      const kat = KAT_AD[h.kategori] || h.kategori || '';
      const dil = h.dil === 'tr' ? '🇹🇷' : '🇬🇧';
      const zaman = zamanGecmis(h.yayin_tarihi);
      const ic = `<div class="nm"><span class="badge ${cls}">${h.etiket}</span> ` +
        (h.sembol ? `<b>${h.sembol}</b> ` : '') + h.baslik +
        `<br><small style="color:var(--tx2)">${kat} ${dil} · ${h.kaynak || ''} · <b style="color:var(--tx)">${zaman}</b></small></div>`;
      html += h.link
        ? `<a class="ev" style="text-decoration:none;color:inherit" href="${h.link}" target="_blank" rel="noopener">${ic}</a>`
        : `<div class="ev">${ic}</div>`;
    });
    html += '<div class="note">Kaynaklar: Yahoo Finance (BIST + altın/gümüş) · Habertürk · Fortune TR · Paratic · Bloomberg HT · CNBC Ekonomi/Dünya · Investing.com · Google News (KAP bildirim + TR borsa + global makro). Etiketler anahtar kelime kurallarıyla otomatik — uydurma yorum yok. Başlığa tıkla → kaynağa git.</div>';
  } else {
    html += '<div class="empty">Bu filtreye uyan haber yok</div>';
  }

  // Tarama (mevcut)
  const tr = d.sinyaller && d.sinyaller.tarama;
  if (tr) {
    html += '<h2>🔍 Aşırı Satım (RSI &lt; 30) <span class="cnt">' + (tr.asiri_satim||[]).length + '</span></h2>';
    html += (tr.asiri_satim && tr.asiri_satim.length)
      ? '<div class="chips">' + tr.asiri_satim.map(r => `<span class="chip"><b style="color:var(--info)">${r.sembol}</b> ${fmt(r.fiyat)} <span class="r">RSI ${fmt(r.rsi,0)} · ${r.sinyal}</span></span>`).join('') + '</div>'
      : '<div class="empty" style="padding:6px 0">Yok</div>';
    html += '<h2>🔴 Aşırı Alım (RSI &gt; 75) <span class="cnt">' + (tr.asiri_alim||[]).length + '</span></h2>';
    html += (tr.asiri_alim && tr.asiri_alim.length)
      ? '<div class="chips">' + tr.asiri_alim.map(r => `<span class="chip"><b style="color:var(--down)">${r.sembol}</b> ${fmt(r.fiyat)} <span class="r">RSI ${fmt(r.rsi,0)} · ${r.sinyal}</span></span>`).join('') + '</div>'
      : '<div class="empty" style="padding:6px 0">Yok</div>';
    html += '<h2>🟢 MACD Güçlü (skor ≥ 2) <span class="cnt">' + (tr.macd_guclu||[]).length + '</span></h2>';
    html += (tr.macd_guclu && tr.macd_guclu.length)
      ? '<div class="chips">' + tr.macd_guclu.map(r => `<span class="chip"><b style="color:var(--up)">${r.sembol}</b> ${fmt(r.fiyat)} <span class="r">${r.sinyal} · skor ${r.skor > 0 ? '+' : ''}${r.skor}</span></span>`).join('') + '</div>'
      : '<div class="empty" style="padding:6px 0">Yok</div>';
  }

  // Takvim (mevcut, alta taşındı)
  html += '<h2>📅 Ekonomik Takvim</h2>';
  if (d.takvim && d.takvim.length) {
    d.takvim.slice(0, 10).forEach(ev => {
      const cls = ev.onem === 'high' ? 'hi' : (ev.onem === 'mid' ? 'mi' : '');
      html += `<div class="ev"><div class="dt">${ev.tarih}</div><div class="tm">${ev.saat}</div>` +
              `<div class="nm"><span class="${cls}">${ev.ulke}</span> · ${ev.olay}</div></div>`;
    });
  } else html += '<div class="empty">Takvim verisi yok</div>';

  document.getElementById('sec-haber').innerHTML = html;
}

function renderFon(d) {

  if (f && f.fonlar && f.fonlar.length) {

      html += `<h2>📊 Fonların Risk İştahı <span class="cnt">${f.tarih}</span></h2>`;
      html += '<div class="scn">' +
        `<div class="sc"><div class="t">İncelenen Fon</div><div class="o">${f.ozet.fon_sayisi}</div></div>` +

        '</div>';
    }

      html += `<tr><td class="sym">${fn.kod}</td><td>%${fn.hisse_agirlik}</td>` +

    });

  } else {
    html += '<div class="empty">🏦 TEFAS fon verisi şu an yok — bir sonraki güncellemede</div>';

    d.sektorler.forEach(x => {
      const genislik = Math.round(x.hisse_sayisi / maxH * 100);
      html += `<tr><td class="sym">${sekTr(x.sektor)}</td><td>${x.hisse_sayisi}</td>` +
        `<td class="${ok(x.ort_skor)}">${x.ort_skor > 0 ? '+' : ''}${x.ort_skor}</td>` +
        `<td class="up">${x.al}</td><td class="down">${x.sat}</td>` +
        `<td style="min-width:110px"><div class="bar"><i style="width:${genislik}%;background:var(--accent)"></i></div></td></tr>`;
    });
    html += '</tbody></table></div><div class="note">Sektörler Yahoo Finance resmi sınıflandırmasıdır.</div>';
  }

  if (d.temel_analiz && d.temel_analiz.length) {
    html += '<h2>💎 Temel Analiz — BIST 30 <span class="cnt">değer skoru</span></h2><div class="twrap"><table><tr>' +
      '<th>Hisse</th><th>F/K</th><th>PD/DD</th><th>Temettü</th><th>Skor</th><th>Not</th></tr><tbody>';
    d.temel_analiz.forEach(x => {
      let notlar = [];
      if (x.fk != null && x.fk < 5) notlar.push('F/K çok ucuz');
      else if (x.fk != null && x.fk < 10) notlar.push('F/K ucuz');
      if (x.pddd != null && x.pddd < 1) notlar.push('PD/DD defter altı');
      if (x.temettu != null && x.temettu > 3) notlar.push('Yüksek temettü');
      html += `<tr><td class="sym">${x.sembol}</td>` +
        `<td>${x.fk == null ? '—' : fmt(x.fk)}</td>` +
        `<td>${x.pddd == null ? '—' : fmt(x.pddd)}</td>` +
        `<td>${x.temettu == null ? '—' : '%' + fmt(x.temettu,1)}</td>` +
        `<td style="color:${x.skor >= 3 ? 'var(--up)' : 'var(--warn)'};font-weight:700">+${x.skor}</td>` +
        `<td class="ned">${notlar.join(' · ') || '—'}</td></tr>`;
    });
    html += '</tbody></table></div><div class="note">Değer skoru: F/K&lt;5 (+2), &lt;10 (+1); PD/DD&lt;1 (+2), &lt;1.5 (+1); temettü&gt;%3 (+1).</div>';
  }
  document.getElementById('fon-icerik').innerHTML = html;
}

/* ══════════ KRİPTO ══════════ */
let KRIPTO_VERI = null;

// fiyat kısaltma: coin başına anlamlı hassasiyet (BTC 82.508,00 / SHIB 0,0000123)
function krFiyat(n) {
  if (n == null) return '—';
  const a = Math.abs(n);
  const h = a >= 1000 ? 2 : a >= 1 ? 2 : a >= 0.01 ? 4 : 8;
  return Number(n).toLocaleString('tr-TR', {minimumFractionDigits: h, maximumFractionDigits: h});
}
// büyük sayı kısaltma: 2,91 T / 139,4 Mr
function krBuyuk(n) {
  if (n == null) return '—';
  const a = Math.abs(n);
  if (a >= 1e12) return fmt(n / 1e12, 2) + ' T';
  if (a >= 1e9) return fmt(n / 1e9, 1) + ' Mr';
  if (a >= 1e6) return fmt(n / 1e6, 1) + ' M';
  return fmt(n, 0);
}

    if (k) {

  } else {
    html += '<h2>📊 Coinler <span class="cnt">skor · sinyal</span></h2><div class="kr-grid">';

      const d24 = c.degisim_24s, d7 = c.degisim_7g, st = c.sinyal === 'PARİTE';

        `<div class="hd"><span class="ksym">${c.sembol}</span>` +
          (c.sira ? `<span class="rank">#${c.sira}</span>` : '') +
          `<span class="nm">${c.ad || ''}</span></div>` +
        `<div class="pz">$${krFiyat(c.fiyat)}</div>` +
        (c.fiyat_tl != null ? `<div class="tl">₺${krFiyat(c.fiyat_tl)}</div>` : '') +
        `<div class="ch">` +
          `<span class="${ok(d24)}">${yuzde(d24)} <span class="lb">24s</span></span>` +
          (d7 != null ? `<span class="${ok(d7)}">${yuzde(d7)} <span class="lb">7g</span></span>` : '') +
        `</div>` +
        `<div class="sp">${sparkSVG(c)}</div>` +

/* ── ICT TARAYICI (Katman 2 — PineScript→Python mantığı) ── */
function ictListe(baslik, ikon, items, satirFn) {
  if (!items || !items.length) return '';
  let h = `<h2>${ikon} ${baslik} <span class="cnt">${items.length}</span></h2><div class="ict-list">`;
  items.forEach(x => { h += `<div class="ict-row">${satirFn(x)}</div>`; });
  return h + '</div>';
}
const ictYon = y => `<span class="tag ${y === 'BULLISH' ? 'up' : 'dn'}">${y === 'BULLISH' ? '▲ ALIŞ' : '▼ SATIŞ'}</span>`;

function renderIct(d) {
  const sec = document.getElementById('sec-ict');
  const t = d && d.ict_tarama;
  if (!t) { sec.innerHTML = '<div class="empty">ICT verisi bekleniyor — bir sonraki veri güncellemesinde gelecek</div>'; return; }
  const al = t.al || [], sat = t.sat || [];
  let html = '<h2>🧭 ICT Tarayıcı <span class="cnt">' + (t.islenen || 0) + ' hisse tarandı</span>' +
             '<span class="fresh ok">PineScript→Python</span></h2>';

  const kart = (etiket, deger, renk) => `<div class="sc"><div class="t">${etiket}</div><div class="o" style="color:${renk}">${deger}</div></div>`;

    kart('AL · skor ≥3', al.length, 'var(--up)') +
    kart('SAT · skor ≤-3', sat.length, 'var(--down)') +
    kart('MSS ↑ / ↓', (t.mss_yukari || []).length + ' / ' + (t.mss_asagi || []).length, 'var(--info)') +
    kart('OB içinde', (t.ob_ici || []).length, 'var(--warn)') +

  html += ictListe('AL Sinyali (ICT skor ≥3)', '🟢', al, x =>
    `<span class="sym">${x.sembol}</span><span class="px">${fmt(x.fiyat)}</span>` +
    `<span class="skor" style="color:var(--up)">+${x.skor}</span>` +
    `<span class="dsc">${(x.nedenler || [])[0] || ''}</span>`);
  html += ictListe('SAT Sinyali (ICT skor ≤-3)', '🔴', sat, x =>

    `<span class="skor" style="color:var(--down)">${x.skor}</span>` +
    `<span class="dsc">${(x.nedenler || [])[0] || ''}</span>`);
  html += ictListe('Yapı Kırılımı ↑ (MSS / BOS)', '⬆️', t.mss_yukari, x =>
    `<span class="sym">${x.sembol}</span><span class="px">${fmt(x.fiyat)}</span>${ictYon('BULLISH')}<span class="dsc">${x.aciklama}</span>`);

  html += [
    ['MSS · Piyasa Yapı Kayması', 'Market Structure Shift — fiyatın son tepe/dip yapısını kırıp yön değiştirmesi. ↑ = düşüş yapısı bozuldu (alış), ↓ = yükseliş yapısı bozuldu (satış).'],
    ['BOS · Yapı Kırılımı', 'Break of Structure — trend yönünde bir önceki tepe/dip kırılır; trendin devamı sayılır.'],
    ['FVG · Adil Değer Boşluğu', 'Fair Value Gap — 3 mumluk hızlı hareketin bıraktığı fiyat boşluğu; fiyat çoğu zaman geri dönüp bu boşluğu doldurur.'],
    ['OB · Order Block', 'Kurumsal emir bölgesi — büyük hareketin başladığı son ters mum; fiyat dönünce bu bölgeden tepki verir (giriş bölgesi).'],
    ['EQH / EQL', 'Eşit Yüksekler / Eşit Düşükler — aynı seviyedeki iki tepe/dip; üstü/altı biriken stop emirleri = likidite havuzu.'],
    ['Süpürme · stop avı', 'Likidite süpürmesi — fiyat EQH/EQL seviyesini hızla delip geri döner; stopları tetikleyip asıl yönün başlangıcı.'],
    ['Likidite', 'Fiyatın çekildiği emir yığınları — stop-loss ve bekleyen emirlerin toplandığı seviyeler.'],
    ['Displacement', 'Yer değiştirme — FVG/OB bırakan güçlü, tek yönlü impuls mum (kurumsal giriş işareti).']
  ].map(([b, tt]) => `<div class="k"><b>${b}</b>${tt}</div>`).join('');
  html += '</div>';

  // ── SENARYO OKUMASI (geçmiş → şimdi → gelecek) ──
  const yon = al.length > sat.length ? 'YUKARI (alış ağır)' : sat.length > al.length ? 'AŞAĞI (satış ağır)' : 'NÖTR (dengeli)';
  let gelecek;
  if (al.length > sat.length) gelecek = 'Alış sinyali veren hisselerde FVG/OB bölgesine geri çekilme alım fırsatı; üstteki EQH likiditesi hedef. SAT tarafında yapı bozulursa aşağı süpürme riski var.';
  else if (sat.length > al.length) gelecek = 'Satış sinyali ağır — aşağı yapı kırılımları sürerse destek süpürmeleri (EQL) beklenir; alış için FVG/OB tepkisi teyit edilmeli.';
  else gelecek = 'Sinyaller dengeli — teyit için MSS yönü ve FVG dolumu izlenmeli; net yön gelene kadar bekle-gör.';
  html += '<div class="ict-not" style="border-style:solid">🔭 <b>Senaryo okuması</b><br>' +
    `<b>Şimdi:</b> ${t.islenen || 0} hisse tarandı · ${al.length} alış / ${sat.length} satış → genel eğilim ${yon}. ` +
    `${(t.mss_yukari || []).length} yukarı / ${(t.mss_asagi || []).length} aşağı yapı kırılımı, ${(t.fvg_acik || []).length} açık FVG, ` +
    `${(t.eqh || []).length} EQH / ${(t.eql || []).length} EQL, ${(t.sweep || []).length} likidite süpürmesi.<br>` +
    `<b>Gelecek:</b> ${gelecek}</div>`;

  sec.innerHTML = html;
}

/* ── ZİYARETÇİ GÖSTERGESİ ──
   Tamamen yerel/dekoratif. Ağ isteği, çerez, localStorage veya dış servis YOK.
   Gösterilen sayı tarihe göre deterministik üretilir (herkes aynı gün aynı sayıyı görür). */
const ZY_TABAN = 121;        // günlük gösterilen taban (patron: "121 yap")
const ZY_YAYILIM = 6;        // güne göre 0..5 sapma → günlük 121..126
const ZY_EPOK = Date.UTC(2026, 0, 1);
function zyHash(s){ let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
function zyYukle(){
  const d = new Date();
  const gunK = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  const bugun = ZY_TABAN + (zyHash(gunK) % ZY_YAYILIM);
  const gecenGun = Math.max(0, Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - ZY_EPOK) / 864e5));
  const toplam = 480 + gecenGun * 57 + (zyHash('top' + gunK) % 23);
  const elB = document.getElementById('zyBugun'), elT = document.getElementById('zyToplam');
  if (elB) elB.textContent = bugun.toLocaleString('tr-TR');
  if (elT) elT.textContent = toplam.toLocaleString('tr-TR');
}
