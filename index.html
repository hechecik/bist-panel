<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BIST Panel</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<meta name="description" content="BIST piyasa paneli — sinyaller, makro, test senaryoları. Seans içinde periyodik güncellenir.">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="bayatBant" role="alert"></div>

<header>
  <div class="logo">BIST<span>·PANEL</span></div>
  <div class="live" id="liveInfo"><span class="dot"></span><span id="liveText">bekleniyor</span></div>
</header>

<div class="hero">
  <div class="ex-card">
    <div class="ex-label">BIST 100 · XU100</div>
    <div class="ex-val" id="exVal">—</div>
    <div class="ex-chg" id="exChg"></div>
    <div class="ex-sub" id="exSub"></div>
    <div class="cards" id="ozetKartlar"></div>
  </div>
</div>

<div class="makro" id="makroRow"></div>

<main>
  <section class="sec active" id="sec-piyasa"></section>
  <section class="sec" id="sec-grafik"></section>
  <section class="sec" id="sec-altin"></section>
  <section class="sec" id="sec-kripto"></section>
  <section class="sec" id="sec-senaryo"><div id="karne-hesap"></div><div id="karne-icerik"></div></section>
  <section class="sec" id="sec-haber"></section>
  <section class="sec" id="sec-takvim"></section>
  <section class="sec" id="sec-fon"><div id="getiri-blok"></div><div id="fon-icerik"></div></section>
  <section class="sec" id="sec-ict"></section>
</main>

<div class="ziyaretci">👥 Bugün <b id="zyBugun">—</b> · Toplam <b id="zyToplam">—</b> ziyaretçi</div>

<nav class="tabs">
  <button class="tab active" data-sec="piyasa"><span class="ic">📊</span>Piyasa</button>
  <button class="tab" data-sec="grafik"><span class="ic">📈</span>Grafik</button>
  <button class="tab" data-sec="altin"><span class="ic">🥇</span>Altın</button>
  <button class="tab" data-sec="kripto"><span class="ic">🪙</span>Kripto</button>
  <button class="tab" data-sec="senaryo"><span class="ic">📋</span>Karne</button>
  <button class="tab" data-sec="haber"><span class="ic">📰</span>Haberler</button>
  <button class="tab" data-sec="takvim"><span class="ic">📅</span>Takvim</button>
  <button class="tab" data-sec="fon"><span class="ic">💵</span>Getiri</button>
  <button class="tab" data-sec="ict"><span class="ic">🧭</span>ICT</button>
</nav>

<!-- MUM GRAFİK MODALI -->
<div class="modal" id="grafikModal" onclick="if(event.target===this)grafikKapat()">
  <div class="modal-box">
    <div class="modal-head"><span id="modalSym">—</span><button class="gbtn x" onclick="grafikKapat()">✕</button></div>
    <div id="modalWidget" style="flex:1;min-height:0"></div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
