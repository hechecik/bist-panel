<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BIST Panel</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<meta name="description" content="BIST piyasa paneli — sinyaller, makro, test senaryoları. 15 dk gecikmeli, seans boyunca canlı.">
<style>
:root {
  color-scheme: dark;
  --bg:#0b0e14; --bg2:#11151f; --bg3:#161b27; --bd:#232a3b; --tx:#d7dde8; --tx2:#8b95a9;
  --up:#2ecc71; --down:#ff5c5c; --warn:#f0b90b; --info:#4da3ff; --accent:#7c5cff;
}
* { box-sizing:border-box; margin:0; padding:0; }
html { -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--tx); font-family:-apple-system,'Segoe UI',Roboto,system-ui,sans-serif; padding-bottom:70px; font-size:13px; }
/* ── ÜST BAR ── */
header { position:sticky; top:0; z-index:50; background:rgba(11,14,20,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--bd); padding:10px 16px; display:flex; align-items:center; gap:10px; }
.logo { font-size:21px; font-weight:800; letter-spacing:-.5px; }
.logo span { color:var(--accent); }
.live { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:11px; color:var(--tx2); }
.dot { width:8px; height:8px; border-radius:50%; background:var(--up); animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
.stale .dot { background:var(--warn); }
/* ── ENDEKS + ÖZET ── */
.hero { padding:12px 16px 4px; }
.ex-card { background:linear-gradient(135deg,#141b2d 0%,#1a1233 100%); border:1px solid var(--bd); border-radius:16px; padding:14px 18px; position:relative; overflow:hidden; }
.ex-card::after { content:''; position:absolute; right:-40px; top:-40px; width:140px; height:140px; background:radial-gradient(circle,rgba(124,92,255,.25),transparent 70%); }
.ex-label { font-size:11px; color:var(--tx2); text-transform:uppercase; letter-spacing:1px; }
.ex-val { font-size:32px; font-weight:800; margin-top:2px; font-variant-numeric:tabular-nums; }
.ex-chg { font-size:13px; font-weight:600; margin-top:1px; }
.up { color:var(--up); } .down { color:var(--down); }
.ex-sub { display:flex; gap:14px; margin-top:8px; font-size:10.5px; color:var(--tx2); flex-wrap:wrap; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(80px,1fr)); gap:8px; margin-top:8px; }
.card { background:var(--bg2); border:1px solid var(--bd); border-radius:12px; padding:8px 6px; text-align:center; }
.card .t { font-size:9px; color:var(--tx2); text-transform:uppercase; letter-spacing:.5px; }
.card .v { font-size:17px; font-weight:800; margin-top:2px; }
/* ── MAKRO ── */
.makro { display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:8px; padding:10px 16px 4px; }
.mk { background:var(--bg2); border:1px solid var(--bd); border-radius:10px; padding:8px 10px; }
.mk .t { font-size:9px; color:var(--tx2); text-transform:uppercase; }
.mk .v { font-size:14px; font-weight:700; margin-top:1px; font-variant-numeric:tabular-nums; }
.mk .d { font-size:9.5px; font-weight:600; }
/* ── SEKMELER ── */
nav.tabs { position:fixed; bottom:0; left:0; right:0; z-index:50; display:flex; background:rgba(11,14,20,.95); backdrop-filter:blur(12px); border-top:1px solid var(--bd); padding-bottom:env(safe-area-inset-bottom); }
.tab { flex:1; padding:9px 2px 7px; text-align:center; font-size:9.5px; color:var(--tx2); cursor:pointer; border:none; background:none; transition:color .2s; }
.tab .ic { display:block; font-size:17px; margin-bottom:1px; }
.tab.active { color:var(--up); }
.tab.active .ic { transform:scale(1.08); }
/* ── İÇERİK ── */
main { padding:0 16px; }
.sec { display:none; } .sec.active { display:block; animation:fade .25s; }
@keyframes fade { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
h2 { font-size:14px; margin:14px 0 8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
h2 .cnt { font-size:10.5px; background:var(--bg3); border:1px solid var(--bd); padding:1px 8px; border-radius:20px; color:var(--tx2); }
/* ── ARAÇ ÇUBUĞU ── */
.toolbar { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
.toolbar input, .toolbar select { background:var(--bg2); border:1px solid var(--bd); color:var(--tx); border-radius:10px; padding:8px 12px; font-size:12.5px; outline:none; }
.toolbar input { flex:1; min-width:130px; }
.toolbar input:focus, .toolbar select:focus { border-color:var(--accent); }
.toolbar select { cursor:pointer; }
.btn { background:var(--bg3); border:1px solid var(--bd); color:var(--tx); border-radius:10px; padding:8px 13px; font-size:12.5px; cursor:pointer; font-weight:600; }
.btn:hover { border-color:var(--accent); }
/* ── GEÇE ANALİZİ (kompakt) ── */
.gece { background:var(--bg2); border:1px solid var(--bd); border-radius:14px; padding:0; margin-top:12px; }
.gece summary { padding:12px 14px; cursor:pointer; font-weight:700; font-size:13px; list-style:none; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.gece summary::-webkit-details-marker { display:none; }
.gece .ic { margin-left:auto; color:var(--tx2); font-size:11px; }
.gece .ic-body { padding:0 14px 14px; }
.gece .k { font-size:10px; color:var(--tx2); text-transform:uppercase; letter-spacing:.4px; margin:10px 0 4px; }
/* ── PORTFÖY ── */
.portfoy { background:var(--bg2); border:1px solid var(--bd); border-radius:14px; padding:12px 14px; margin-top:12px; }
.portfoy .top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; }
.portfoy .top .o { font-size:18px; font-weight:800; }
.portfoy input { background:var(--bg3); border:1px solid var(--bd); color:var(--tx); border-radius:8px; padding:6px 9px; font-size:12px; width:86px; outline:none; }
.portfoy input:focus { border-color:var(--accent); }
.pf-row { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid #1a2030; font-size:12px; flex-wrap:wrap; }
.pf-row .sym { min-width:52px; font-weight:700; }
.pf-row .sil { margin-left:auto; background:none; border:none; color:var(--down); cursor:pointer; font-size:14px; }
.pf-row .sifirla { background:none; border:none; color:var(--info); cursor:pointer; font-size:11px; }
/* ── TABLO ── */
.twrap { overflow-x:auto; border:1px solid var(--bd); border-radius:12px; background:var(--bg2); }
table { width:100%; border-collapse:collapse; font-size:11.5px; min-width:1060px; }
th { color:var(--tx2); text-align:left; padding:7px 5px; border-bottom:1px solid var(--bd); font-size:9px; text-transform:uppercase; letter-spacing:.4px; white-space:nowrap; background:var(--bg3); position:sticky; top:0; }
td { padding:7px 5px; border-bottom:1px solid #1a2030; font-variant-numeric:tabular-nums; white-space:nowrap; vertical-align:middle; }
tr:active { background:var(--bg3); }
tbody tr { cursor:pointer; }
tbody tr:hover { background:rgba(124,92,255,.06); }
.sym { font-weight:700; position:sticky; left:0; background:var(--bg2); z-index:1; }
th.sym { left:0; z-index:2; }
.badge { display:inline-block; padding:1px 7px; border-radius:20px; font-size:9.5px; font-weight:700; }
.b-AL { background:rgba(46,204,113,.15); color:var(--up); }
.b-DİKKAT_AL { background:rgba(240,185,11,.15); color:var(--warn); }
.b-TUT { background:rgba(139,149,169,.15); color:var(--tx2); }
.b-DİKKAT_SAT { background:rgba(255,92,92,.12); color:var(--warn); }
.b-SAT { background:rgba(255,92,92,.18); color:var(--down); }
.ned { font-size:9.5px; color:var(--tx2); max-width:230px; white-space:normal; line-height:1.4; }
.ned b { color:var(--tx); }
tr.detail td { background:var(--bg3); padding:11px; white-space:normal; }
.det-ic { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px 14px; font-size:11px; line-height:1.6; }
.det-ic .k { color:var(--tx2); font-size:9.5px; text-transform:uppercase; letter-spacing:.4px; }
.det-ic ul { list-style:none; margin-top:2px; }
.det-ic li { padding:2px 0 2px 14px; position:relative; color:var(--tx); }
.det-ic li::before { content:'▸'; position:absolute; left:0; color:var(--accent); }
.fresh { display:inline-block; padding:1px 8px; border-radius:20px; font-size:9.5px; font-weight:700; background:rgba(240,185,11,.12); color:var(--warn); margin-left:8px; }
.fresh.ok { background:rgba(46,204,113,.12); color:var(--up); }
/* ── SENARYO ── */
.scn { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.sc { background:var(--bg2); border:1px solid var(--bd); border-radius:14px; padding:12px 14px; }
.sc .t { font-size:10.5px; color:var(--tx2); }
.sc .o { font-size:24px; font-weight:800; margin-top:3px; }
.sc .m { font-size:10.5px; color:var(--tx2); margin-top:5px; line-height:1.5; }
.sc .m b { color:var(--tx); }
.sc.wide { grid-column:1/-1; }
.bar { height:5px; border-radius:4px; background:#1a2030; margin-top:7px; overflow:hidden; display:flex; }
.bar i { display:block; height:100%; }
/* ── TAKVİM / HABER ── */
.ev { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid #1a2030; align-items:flex-start; }
.ev .tm { min-width:40px; font-size:10.5px; color:var(--tx2); font-variant-numeric:tabular-nums; padding-top:2px; }
.ev .dt { font-size:10.5px; color:var(--tx2); min-width:40px; }
.ev .nm { font-size:12px; line-height:1.4; }
.hi { color:var(--down); font-weight:700; } .mi { color:var(--warn); }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin:5px 0 10px; }
.chip { background:var(--bg3); border:1px solid var(--bd); border-radius:20px; padding:3px 10px; font-size:11px; }
.chip b { font-weight:700; }
.chip .r { color:var(--tx2); font-size:9.5px; }
.tcmb { background:var(--bg2); border:1px solid var(--bd); border-radius:14px; padding:12px 14px; font-size:12.5px; line-height:1.6; }
.tcmb b { color:var(--tx); }
.note { font-size:10px; color:var(--tx2); line-height:1.5; margin:12px 0 6px; }
.empty { color:var(--tx2); font-size:12px; padding:16px 0; text-align:center; }
</style>
</head>
<body>

<header>
  <div class="logo">BIST<span>·PANEL</span></div>
  <div class="live" id="liveInfo"><span class="dot"></span><span id="liveText">bekleniyor</span></div>
</header>

<div class="hero">
  <div class="ex-card">
    <div class="ex-label">BIST 100 · XU100</div>
    <div class="ex-val" id="exVal">—</div>
    <div class="ex-chg" id="exChg"></div>
    <div class="ex-sub" id="exSub"></div>
    <div class="cards" id="ozetKartlar"></div>
  </div>
</div>

<div class="makro" id="makroRow"></div>

<main>
  <section class="sec active" id="sec-piyasa"></section>
  <section class="sec" id="sec-grafik"></section>
  <section class="sec" id="sec-senaryo"></section>
  <section class="sec" id="sec-haber"></section>
  <section class="sec" id="sec-fon"></section>
</main>

<nav class="tabs">
  <button class="tab active" data-sec="piyasa"><span class="ic">📊</span>Piyasa</button>
  <button class="tab" data-sec="grafik"><span class="ic">📈</span>Grafik</button>
  <button class="tab" data-sec="senaryo"><span class="ic">🧪</span>Senaryo</button>
  <button class="tab" data-sec="haber"><span class="ic">📰</span>Haberler</button>
  <button class="tab" data-sec="fon"><span class="ic">🏦</span>Fonlar</button>
</nav>

<script>
const SEC = document.querySelectorAll('.tab');
SEC.forEach(t => t.addEventListener('click', () => {
  SEC.forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  document.querySelectorAll('.sec').forEach(s => s.classList.remove('active'));
  document.getElementById('sec-' + t.dataset.sec).classList.add('active');
  if (t.dataset.sec === 'grafik' && typeof tvYukle === 'function') tvYukle();
}));

const fmt = (n, d=2) => n == null ? '—' : Number(n).toLocaleString('tr-TR', {minimumFractionDigits:d, maximumFractionDigits:d});
const yuzde = n => n == null ? '' : (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
const ok = n => n >= 0 ? 'up' : 'down';

function badge(s) {
  const m = {'AL':'b-AL','DİKKAT_AL':'b-DİKKAT_AL','TUT':'b-TUT','DİKKAT_SAT':'b-DİKKAT_SAT','SAT':'b-SAT'};
  return `<span class="badge ${m[s]||'b-TUT'}">${s}</span>`;
}

/* ── YORUMLAR ── */
function rsiYorum(r) {
  if (r.rsi == null) return '';
  if (r.rsi < 30) return `<span style="color:var(--info)">${fmt(r.rsi,0)} aşırı satım</span>`;
  if (r.rsi > 70) return `<span style="color:var(--down)">${fmt(r.rsi,0)} aşırı alım</span>`;
  if (r.rsi >= 55) return `<span style="color:var(--up)">${fmt(r.rsi,0)} güçlü</span>`;
  if (r.rsi >= 45) return `<span style="color:var(--tx)">${fmt(r.rsi,0)} nötr</span>`;
  return `<span style="color:var(--warn)">${fmt(r.rsi,0)} zayıf</span>`;
}
function mfiYorum(r) {
  if (r.mfi == null) return '—';
  const renk = r.para === 'GİRİŞ' ? 'var(--up)' : (r.para === 'ÇIKIŞ' ? 'var(--down)' : 'var(--tx)');
  return `<span style="color:${renk}">${fmt(r.mfi,0)} ${r.para || ''}</span>`;
}
function trendHtml(r) {
  if (r.trend === 'YUKARI') return '▲ <span class="up">YUKARI</span>';
  if (r.trend === 'AŞAĞI') return '▼ <span class="down">AŞAĞI</span>';
  return '▶ <span style="color:var(--tx2)">YATAY</span>';
}
function squeezeHtml(r) {
  const s = (r.squeeze || '').toUpperCase();
  if (s.includes('YUKARI')) return '🚀 <span class="up">KIRILIM ↑</span>';
  if (s.includes('AŞAĞI')) return '🕳️ <span class="down">KIRILIM ↓</span>';
  if (s.includes('SIKIŞMA')) return '🧲 <span style="color:var(--warn)">SIKIŞMA</span>';
  return '—';
}
function sparkSVG(r) {
  if (!r.spark || r.spark.length < 2) return '—';
  const v = r.spark;
  const min = Math.min(...v), max = Math.max(...v);
  const W = 84, H = 26, span = (max - min) || 1;
  const pts = v.map((x, i) => `${(i/(v.length-1)*W).toFixed(1)},${(H-2-((x-min)/span)*(H-4)).toFixed(1)}`).join(' ');
  const renk = v[v.length-1] >= v[0] ? 'var(--up)' : 'var(--down)';
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline points="${pts}" fill="none" stroke="${renk}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* ── VERİ TAZELİĞİ ── */
function tazelik(veriTarihi) {
  if (!veriTarihi) return '';
  const gun = Math.floor((Date.now() - new Date(veriTarihi + 'T18:00:00').getTime()) / 86400000);
  if (gun <= 1) return '<span class="fresh ok">BUGÜN</span>';
  return `<span class="fresh">${gun} GÜN ESKİ</span>`;
}

/* ── TABLO ── */
const KOLONLAR = ['Hisse','Grafik','Fiyat','1A','Skor','Sinyal','Trend','Para','RSI','MFI','Squeeze','S1/R1','SL/Hdf','Neden'];

function hisseSatir(r, durum) {
  const onceki = durum.detay.get(r.sembol);
  let html = `<tr data-sym="${r.sembol}">` +
    `<td class="sym">${r.sembol}</td>` +
    `<td>${sparkSVG(r)}</td>` +
    `<td>${fmt(r.fiyat)}</td>` +
    `<td class="${ok(r.ay_oncesi)}">${r.ay_oncesi == null ? '—' : yuzde(r.ay_oncesi)}</td>` +
    `<td style="color:${r.skor>=3?'var(--up)':r.skor<=-3?'var(--down)':'var(--warn)'};font-weight:700">${r.skor>0?'+':''}${r.skor}</td>` +
    `<td>${badge(r.sinyal)}</td>` +
    `<td>${trendHtml(r)}</td>` +
    `<td>${mfiYorum(r)}</td>` +
    `<td>${rsiYorum(r)}</td>` +
    `<td>${r.mfi == null ? '—' : fmt(r.mfi,0)}</td>` +
    `<td>${squeezeHtml(r)}</td>` +
    `<td>${r.s1 == null ? '—' : `<span style="color:var(--down)">${fmt(r.s1)}</span> / <span style="color:var(--up)">${fmt(r.r1)}</span>`}</td>` +
    `<td>${r.stop == null ? '—' : `${fmt(r.stop)} / ${fmt(r.hedef)}`}</td>` +
    `<td class="ned">${(r.nedenler||[]).slice(0,2).map(n=>'▸ '+n).join('<br>')}</td></tr>`;
  if (onceki) {
    html += `<tr class="detail" data-det="${r.sembol}"><td colspan="${KOLONLAR.length}"><div class="det-ic">` +
      `<div><div class="k">📋 Tüm Nedenler</div><ul>${(r.nedenler||[]).map(n=>`<li>${n}</li>`).join('')}</ul></div>` +
      `<div><div class="k">🎯 Seviyeler</div><ul>` +
      `<li>1. Destek (S1): <b>${r.s1 == null ? '—' : fmt(r.s1)}</b></li>` +
      `<li>1. Direnç (R1): <b>${r.r1 == null ? '—' : fmt(r.r1)}</b></li>` +
      `<li>Stop-loss: <b>${r.stop == null ? '—' : fmt(r.stop)}</b></li>` +
      `<li>Hedef: <b>${r.hedef == null ? '—' : fmt(r.hedef)}</b></li></ul></div>` +
      `<div><div class="k">📅 Veri</div><ul>` +
      `<li>Son bar: <b>${r.tarih || '—'}</b></li>` +
      `<li>1A getiri: <b class="${ok(r.ay_oncesi)}">${r.ay_oncesi == null ? '—' : yuzde(r.ay_oncesi)}</b></li>` +
      `<li>MACD hist: <b>${r.macd_hist == null ? '—' : r.macd_hist}</b></li>` +
      `<li>Analiz: <b>${durum.hesapTarihi || '—'}</b></li></ul></div>` +
      `</div></td></tr>`;
  }
  return html;
}

let durum = { detay: new Map(), hesapTarihi: '' };

function tabloBolum(baslik, ikon, liste) {
  let html = `<h2>${ikon} ${baslik} <span class="cnt">${liste.length}</span></h2>`;
  if (!liste.length) return html + '<div class="empty">Sonuç yok</div>';
  html += `<div class="twrap"><table><tr>` + KOLONLAR.map(k => `<th class="${k==='Hisse'?'sym':''}">${k}</th>`).join('') + '</tr><tbody>';
  liste.forEach(r => html += hisseSatir(r, durum));
  return html + '</tbody></table></div>';
}

async function yukle() {
  try {
    const d = await (await fetch('data/piyasa.json?v=' + Date.now())).json();
    durum.hesapTarihi = (d.sinyaller && d.sinyaller.hesap_tarihi) || '';
    renderPiyasa(d); renderSenaryo(d); renderHaber(d); renderFon(d);
    alarmKontrol(); // 3+6 — fiyat eşik alarmları
    const gun = new Date().getDay();
    const ure = new Date(d.uretildi);
    const fark = Math.floor((Date.now() - ure.getTime()) / 60000);
    const lt = document.getElementById('liveText');
    if (gun === 0 || gun === 6) {
      lt.textContent = 'Borsa kapalı · ' + (d.endeks ? d.endeks.tarih + ' kapanış' : '') + ' · ' + ure.toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit'});
      document.querySelector('header').classList.add('stale');
    } else if (fark <= 20) {
      lt.textContent = (fark <= 1 ? 'CANLI' : fark + ' dk önce') + ' · ' + ure.toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit'});
    } else {
      lt.textContent = '⏳ ' + fark + ' dk önce · ' + ure.toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit'});
      document.querySelector('header').classList.add('stale');
    }
  } catch(e) {
    document.getElementById('sec-piyasa').innerHTML = '<div class="empty">Veri yüklenemedi: ' + e.message + '</div>';
  }
}

/* ══════════ PİYASA ══════════ */
let PIYASA_VERI = null;
function renderPiyasa(d) {
  PIYASA_VERI = d;
  const e = d.endeks;
  if (e) {
    document.getElementById('exVal').textContent = fmt(e.deger, 2);
    const chg = document.getElementById('exChg');
    chg.innerHTML = `<span class="${ok(e.degisim_yuzde)}">${yuzde(e.degisim_yuzde)}</span> gün`;
    document.getElementById('exSub').innerHTML =
      `<span>📅 ${e.tarih}</span><span>🔍 ${d.sinyaller.toplam} hisse</span><span>📡 ${d.kaynak}</span>` +
      (d.saglik ? `<span class="${d.saglik.durum === 'OK' ? 'up' : 'down'}">🩺 ${d.saglik.durum}${d.saglik.sorunlar.length ? ' · ' + d.saglik.sorunlar.join(', ') : ''}</span>` : '');
  }
  const s = d.sinyaller;
  const alSay = (s.al||[]).length, tutSay = (s.tut||[]).length, satSay = (s.sat||[]).length;
  document.getElementById('ozetKartlar').innerHTML =
    `<div class="card"><div class="t">🟢 AL</div><div class="v up">${alSay}</div></div>` +
    `<div class="card"><div class="t">🟡 TUT</div><div class="v" style="color:var(--tx2)">${tutSay}</div></div>` +
    `<div class="card"><div class="t">🔴 SAT</div><div class="v down">${satSay}</div></div>` +
    `<div class="card"><div class="t">📊 Analiz</div><div class="v">${s.toplam}</div></div>`;

  const m = d.makro || {};
  let mk = '';
  Object.values(m.fiyatlar || {}).forEach(f => {
    const renk = f.degisim == null ? '' : (f.degisim >= 0 ? 'up' : 'down');
    mk += `<div class="mk"><div class="t">${f.ad}</div><div class="v">${fmt(f.fiyat)}</div>` +
          `<div class="d ${renk}">${f.degisim == null ? f.birim : yuzde(f.degisim)}</div></div>`;
  });
  document.getElementById('makroRow').innerHTML = mk;

  let tcmb = '';
  if (m.faiz && m.faiz.faiz) {
    const reel = m.faiz.faiz - (m.tufe ? m.tufe.yillik : 0);
    const yorum = reel > 0 ? 'POZİTİF reel faiz → altına baskı, TL mevduat cazip' : 'NEGATİF reel faiz → altın/döviz talebi güçlü';
    const karar = m.faiz.karar_tarihi ? `Karar ${m.faiz.karar_tarihi} · uygulama ${m.faiz.tarih}` : `Tarih ${m.faiz.tarih}`;
    tcmb = `<h2>🏛️ Merkez Bankası</h2><div class="tcmb">Politika faizi <b>%${m.faiz.faiz.toFixed(2)}</b> (${karar}) · ` +
           `TÜFE yıllık <b>%${m.tufe ? m.tufe.yillik.toFixed(2) : '?'}</b> · Reel faiz <b class="${ok(reel)}">%${reel >= 0 ? '+' : ''}${reel.toFixed(2)}</b> → ${yorum}</div>`;
  }

  let html = tcmb;
  // 5 — Gece analizi (kompakt, daraltılabilir)
  const g = d.gece_analizi;
  if (g) {
    const chip = (liste, renk, alan) => liste.length
      ? '<div class="chips">' + liste.map(x => `<span class="chip"><b style="color:${renk}">${x.sembol}</b> ${fmt(x.fiyat)} <span class="r">${alan === 'rsi' ? 'RSI ' + fmt(x.rsi,0) : 'skor ' + (x.skor>0?'+':'') + x.skor}</span></span>`).join('') + '</div>'
      : '<div class="empty" style="padding:4px 0">Yok</div>';
    html += `<details class="gece"><summary>🌙 Gece Analizi · Yarın İçin <span class="cnt">${g.tarih || ''}</span><span class="ic">▾ aç/kapa</span></summary><div class="ic-body">` +
      `<div class="k">💪 En Güçlü AL Adayları (skor ≥ 3)</div>${chip(g.guclu_al || [], 'var(--up)', 'skor')}` +
      `<div class="k">⚠️ En Zayıf SAT Adayları (skor ≤ -3)</div>${chip(g.zayif_sat || [], 'var(--down)', 'skor')}` +
      `<div class="k">🧲 Bollinger Sıkışma (kırılım izlenecek)</div>${chip((g.squeeze || []).map(x=>({sembol:x.sembol, fiyat:x.fiyat, skor:0})), 'var(--warn)', 'skor')}` +
      `<div class="k">🔵 Aşırı Satım (RSI &lt; 30)</div>${chip((g.asiri_satim || []).map(x=>({sembol:x.sembol, fiyat:x.fiyat, rsi:x.rsi})), 'var(--info)', 'rsi')}` +
      `<div class="k">📅 Yarının Yüksek Önemli Olayları</div>` +
      ((g.yarin_yuksek_onem || []).length
        ? '<div class="chips">' + g.yarin_yuksek_onem.map(o => `<span class="chip"><b class="hi">${o.saat || ''}</b> ${o.ulke || ''} · ${o.olay}</span>`).join('') + '</div>'
        : '<div class="empty" style="padding:4px 0">Yarın için yüksek önemli olay yok</div>') +
      `</div></details>`;
  }

  // 3+6 — Portföy + alarmlar
  html += portfoyHtml();

  html += `<div class="toolbar">
    <input id="arama" type="search" placeholder="🔍 Hisse ara (örn. THYAO)…" oninput="filtrele()">
    <select id="fSinyal" onchange="filtrele()">
      <option value="">Sinyal: Tümü</option>
      <option value="AL">AL</option><option value="DİKKAT_AL">DİKKAT AL</option>
      <option value="TUT">TUT</option><option value="DİKKAT_SAT">DİKKAT SAT</option>
      <option value="SAT">SAT</option>
    </select>
    <select id="fTrend" onchange="filtrele()">
      <option value="">Trend: Tümü</option>
      <option value="YUKARI">YUKARI</option><option value="YATAY">YATAY</option><option value="AŞAĞI">AŞAĞI</option>
    </select>
    <select id="fSqueeze" onchange="filtrele()">
      <option value="">Squeeze: Tümü</option>
      <option value="SIKIŞMA">🧲 SIKIŞMA</option><option value="KIRILIM">🚀 KIRILIM</option>
    </select>
    <button class="btn" onclick="csvIndir()">⬇ CSV</button>
  </div>`;

  html += tabloBolum('AL ADAYLARI', '🟢', s.al || []);
  html += tabloBolum('İZLEME / TUT', '🟡', s.tut || []);
  html += tabloBolum('SAT / DİKKAT', '🔴', s.sat || []);

  html += '<div class="note">' +
    (s.toplam ? `📊 ${s.toplam} hisse analiz edildi · veri ${s.al && s.al[0] && s.al[0].tarih ? s.al[0].tarih : ''} ${s.al && s.al[0] ? tazelik(s.al[0].tarih) : ''} · ` : '') +
    'Yatırım tavsiyesi değildir. Sinyaller teknik indikatör kombinasyonlarıdır.</div>';
  document.getElementById('sec-piyasa').innerHTML = html;
  durum.detay = new Map();
  document.querySelectorAll('#sec-piyasa tbody tr[data-sym]').forEach(tr => {
    tr.addEventListener('click', () => {
      const sym = tr.dataset.sym;
      const det = document.querySelector(`tr.detail[data-det="${sym}"]`);
      if (det) det.style.display = det.style.display === 'none' ? '' : 'none';
    });
  });
}

/* ══════════ GRAFİK (2 — TradingView, saniyelik canlı) ══════════ */
function renderGrafik(d) {
  const hisseler = [...(d.sinyaller.al||[]), ...(d.sinyaller.tut||[]), ...(d.sinyaller.sat||[])].map(r => r.sembol);
  let html = `<h2>📈 Canlı Grafik <span class="cnt">TradingView</span></h2>` +
    `<div class="toolbar"><select id="tvSym" onchange="tvYukle()">` +
    `<option value="BIST:XU100">BIST 100 (XU100)</option>` +
    hisseler.map(s => `<option value="BIST:${s}">${s}</option>`).join('') +
    `</select><select id="tvInt" onchange="tvYukle()">` +
    `<option value="1">1 dk</option><option value="5">5 dk</option><option value="15" selected>15 dk</option>` +
    `<option value="60">1 saat</option><option value="D">Günlük</option><option value="W">Haftalık</option>` +
    `</select></div>` +
    `<div id="tvWidget" style="height:480px;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2)"></div>` +
    `<div class="note">TradingView embed — saniyelik canlı mum grafiği (key'siz, ücretsiz). Tablolar ~15 dk gecikmeli, grafik canlıdır. Seans dışında son kapanış görünür.</div>`;
  document.getElementById('sec-grafik').innerHTML = html;
  tvYukle();
}
function tvYukle() {
  const el = document.getElementById('tvWidget');
  if (!el) return;
  const sym = document.getElementById('tvSym').value;
  const interval = document.getElementById('tvInt').value;
  el.innerHTML = '';
  const s = document.createElement('script');
  s.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
  s.async = true;
  s.innerHTML = JSON.stringify({
    autosize: true, symbol: sym, interval: interval, timezone: "Europe/Istanbul",
    theme: "dark", style: "1", locale: "tr", hide_side_toolbar: false,
    allow_symbol_change: false, save_image: false,
    studies: ["Volume@tv-basicstudies"], container_id: "tvWidget"
  });
  el.appendChild(s);
}

/* ══════════ FİLTRE ══════════ */
function filtrele() {
  const q = (document.getElementById('arama').value || '').toUpperCase().trim();
  const fs = document.getElementById('fSinyal').value;
  const ft = document.getElementById('fTrend').value;
  const fq = document.getElementById('fSqueeze').value;
  document.querySelectorAll('#sec-piyasa tbody tr[data-sym]').forEach(tr => {
    const sym = tr.dataset.sym;
    const r = PIYASA_VERI && [...(PIYASA_VERI.sinyaller.al||[]), ...(PIYASA_VERI.sinyaller.tut||[]), ...(PIYASA_VERI.sinyaller.sat||[])].find(x => x.sembol === sym);
    if (!r) return;
    const okS = !fs || r.sinyal === fs;
    const okT = !ft || r.trend === ft;
    const okQ = !fq || (fq === 'SIKIŞMA' ? (r.squeeze||'').toUpperCase().includes('SIKIŞMA') : (r.squeeze||'').toUpperCase().includes('KIRILIM'));
    const okA = !q || sym.includes(q);
    tr.style.display = (okS && okT && okQ && okA) ? '' : 'none';
    const det = document.querySelector(`tr.detail[data-det="${sym}"]`);
    if (det) det.style.display = 'none';
  });
}

/* ══════════ CSV ══════════ */
function csvIndir() {
  const d = PIYASA_VERI; if (!d) return;
  const satirlar = [...(d.sinyaller.al||[]), ...(d.sinyaller.tut||[]), ...(d.sinyaller.sat||[])];
  const baslik = 'Hisse,Fiyat,1A%,Skor,Sinyal,Trend,Para,RSI,MFI,Squeeze,S1,R1,Stop,Hedef';
  const csv = [baslik, ...satirlar.map(r =>
    [r.sembol, r.fiyat, r.ay_oncesi ?? '', r.skor, r.sinyal, r.trend, r.para, r.rsi, r.mfi,
     r.squeeze, r.s1 ?? '', r.r1 ?? '', r.stop ?? '', r.hedef ?? ''].join(','))].join('\n');
  const blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bist-panel-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

/* ══════════ PORTFÖY + ALARMLAR (3+6) ══════════ */
function portfoyOku() { try { return JSON.parse(localStorage.getItem('bist_panel_portfoy') || '{}'); } catch(e) { return {}; } }
function portfoyKaydet(p) { localStorage.setItem('bist_panel_portfoy', JSON.stringify(p)); }
function fiyatBul(sym) {
  if (!PIYASA_VERI) return null;
  const hepsi = [...(PIYASA_VERI.sinyaller.al||[]), ...(PIYASA_VERI.sinyaller.tut||[]), ...(PIYASA_VERI.sinyaller.sat||[])];
  const r = hepsi.find(x => x.sembol === sym);
  return r ? r.fiyat : null;
}
function bildirimIzni() {
  if (!('Notification' in window)) return alert('Bu tarayıcı bildirim desteklemiyor');
  Notification.requestPermission().then(p => {
    const el = document.getElementById('bildirimDurum');
    if (el) el.textContent = p === 'granted' ? '✅ Bildirim açık' : '⛔ Bildirim kapalı';
  });
}
function bildirim(ad, mesaj) {
  if ('Notification' in window && Notification.permission === 'granted' && !document.hidden) {
    try {
      new Notification(ad, { body: mesaj, icon: 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>' });
    } catch(e) {}
  }
}
function portfoyHtml() {
  const p = portfoyOku();
  const semboller = Object.keys(p);
  let toplamMaliyet = 0, toplamDeger = 0, toplamKar = 0;
  let satirlar = '';
  semboller.forEach(sym => {
    const k = p[sym];
    const adet = k.adet, maliyet = k.maliyet;
    const fiyat = fiyatBul(sym);
    toplamMaliyet += adet * maliyet;
    if (fiyat) { toplamDeger += adet * fiyat; toplamKar += (fiyat - maliyet) * adet; }
    const kar = fiyat ? (fiyat - maliyet) * adet : null;
    const alarm = (k.hedef || k.stop)
      ? `<span style="font-size:10px;color:var(--tx2)">🎯${k.hedef ? fmt(k.hedef) : '—'} 🛑${k.stop ? fmt(k.stop) : '—'}</span>`
      : '';
    satirlar += `<div class="pf-row"><span class="sym">${sym}</span>` +
      `<span>${adet} adet @ ${fmt(maliyet)}</span>` +
      `<span>Güncel: <b>${fiyat ? fmt(fiyat) : '—'}</b></span>` +
      `<span class="${ok(kar)}">${kar == null ? '—' : (kar >= 0 ? '+' : '') + fmt(kar,0) + ' TL'}</span>` +
      alarm +
      ((k.hedef || k.stop) ? `<button class="sifirla" onclick="alarmSifirla('${sym}')" title="Alarmı sıfırla">↺</button>` : '') +
      `<button class="sil" onclick="portfoySil('${sym}')">✕</button></div>`;
  });
  const kar = toplamKar;
  const bd = ('Notification' in window) ? (Notification.permission === 'granted' ? '✅ Bildirim açık' : '⛔ Kapalı') : '—';
  return `<div class="portfoy"><div class="top">💼 <b>Portföyüm</b>` +
    (semboller.length ? `<span class="o ${ok(kar)}">${kar >= 0 ? '+' : ''}${fmt(kar,0)} TL</span>` +
      `<span style="color:var(--tx2);font-size:10.5px">maliyet ${fmt(toplamMaliyet,0)} · değer ${fmt(toplamDeger,0)}</span>` : '') +
    `<button class="btn" style="margin-left:auto;padding:5px 10px;font-size:11px" onclick="bildirimIzni()">🔔 <span id="bildirimDurum">${bd}</span></button></div>` +
    (semboller.length ? satirlar : '<div class="empty" style="padding:6px 0">Portföy boş — aşağıdan hisse ekle</div>') +
    `<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">` +
    `<input id="pfSym" placeholder="HISSE" style="width:76px" maxlength="10">` +
    `<input id="pfAdet" type="number" placeholder="Adet" style="width:64px" min="1">` +
    `<input id="pfMaliyet" type="number" placeholder="Maliyet TL" style="width:92px" min="0" step="0.01">` +
    `<input id="pfHedef" type="number" placeholder="🎯 Hedef" style="width:80px" min="0" step="0.01">` +
    `<input id="pfStop" type="number" placeholder="🛑 Stop" style="width:80px" min="0" step="0.01">` +
    `<button class="btn" onclick="portfoyEkle()">＋ Ekle</button></div>` +
    `<div class="note">Hedef/stop girersen eşik aşıldığında tarayıcı bildirimi alırsın (sayfa açıkken 15 dk'da bir kontrol). Sadece bu cihazda saklanır.</div></div>`;
}
function portfoyEkle() {
  const sym = (document.getElementById('pfSym').value || '').toUpperCase().trim();
  const adet = parseFloat(document.getElementById('pfAdet').value);
  const maliyet = parseFloat(document.getElementById('pfMaliyet').value);
  const hedef = parseFloat(document.getElementById('pfHedef').value) || null;
  const stop = parseFloat(document.getElementById('pfStop').value) || null;
  if (!sym || !adet || !maliyet) return;
  const p = portfoyOku();
  p[sym] = { adet, maliyet, hedef, stop, tetik_hedef: false, tetik_stop: false };
  portfoyKaydet(p);
  renderPiyasa(PIYASA_VERI);
}
function portfoySil(sym) {
  const p = portfoyOku();
  delete p[sym];
  portfoyKaydet(p);
  renderPiyasa(PIYASA_VERI);
}
function alarmSifirla(sym) {
  const p = portfoyOku();
  if (p[sym]) { p[sym].tetik_hedef = false; p[sym].tetik_stop = false; }
  portfoyKaydet(p);
  renderPiyasa(PIYASA_VERI);
}
function alarmKontrol() {
  if (!PIYASA_VERI) return;
  const p = portfoyOku();
  let mesajlar = [];
  Object.keys(p).forEach(sym => {
    const k = p[sym];
    if (!k.hedef && !k.stop) return;
    const fiyat = fiyatBul(sym);
    if (fiyat == null) return;
    if (k.hedef && fiyat >= k.hedef && !k.tetik_hedef) {
      k.tetik_hedef = true;
      mesajlar.push(`🎯 ${sym} hedefe ulaştı: ${fmt(fiyat)} TL (hedef ${fmt(k.hedef)})`);
    }
    if (k.stop && fiyat <= k.stop && !k.tetik_stop) {
      k.tetik_stop = true;
      mesajlar.push(`🛑 ${sym} stop'a düştü: ${fmt(fiyat)} TL (stop ${fmt(k.stop)})`);
    }
  });
  if (mesajlar.length) {
    portfoyKaydet(p);
    mesajlar.forEach(m => bildirim('BIST Panel Alarm', m));
  }
}

/* ══════════ SENARYO ══════════ */
function renderSenaryo(d) {
  const t = d.test_senaryolari;
  if (!t) { document.getElementById('sec-senaryo').innerHTML = '<div class="empty">Senaryo verisi bekleniyor</div>'; return; }
  let html = '<h2>🧪 Test Senaryoları — 6 Aylık Gerçek Veri · 💵 100K TL Simülasyon</h2><div class="scn">';
  const karti = (s, sermaye, acik) => {
    if (!s) return;
    const renk = s.ortalama >= 0 ? 'var(--up)' : 'var(--down)';
    const poz = Math.max(0, Math.min(100, 50 + s.ortalama * 2));
    const basari = s.islem ? Math.round(s.kazanan / s.islem * 100) : 0;
    const kb = s.islem ? `<div class="bar"><i style="width:${basari}%;background:var(--up)"></i><i style="width:${100-basari}%;background:var(--down)"></i></div>` : '';
    const tl = sermaye ? `<div class="m">💵 <b>100K TL ile: ${fmt(sermaye.sonuc,0)} TL</b> <span class="${ok(sermaye.kar_zarar)}">(${sermaye.kar_zarar >= 0 ? '+' : ''}${fmt(sermaye.kar_zarar,0)} TL)</span> · ${fmt(sermaye.tahsis,0)} TL/pozisyon</div>` : '';
    html += `<div class="sc ${acik?'wide':''}"><div class="t">${s.ad}</div>` +
      `<div class="o" style="color:${renk}">${s.ortalama >= 0 ? '+' : ''}%${s.ortalama.toFixed(1)}</div>` +
      `<div class="bar"><i style="width:${poz}%;background:${s.ortalama>=0?'var(--up)':'var(--down)'}"></i></div>` +
      `<div class="m">${s.islem} işlem · 🟢 ${s.kazanan} · 🔴 ${s.kaybeden} · <b>%${basari} başarı</b></div>` + kb + tl;
    if (s.en_iyi) html += `<div class="m">🏆 ${s.en_iyi.sembol} %${s.en_iyi.getiri_yuzde >= 0 ? '+' : ''}${s.en_iyi.getiri_yuzde} (${s.en_iyi.tarih})</div>`;
    if (s.en_kotu) html += `<div class="m">💀 ${s.en_kotu.sembol} %${s.en_kotu.getiri_yuzde >= 0 ? '+' : ''}${s.en_kotu.getiri_yuzde} (${s.en_kotu.tarih})</div>`;
    html += '</div>';
  };
  const sm = t.sermaye || {};
  karti(t.pazartesi_acilis, sm.pazartesi);
  karti(t.ertesi_gun_acilis, sm.ertesi);
  karti(t.stop_losslu, sm.stop, true);
  html += '</div><div class="note">' + (t.aciklama || '') + '</div>';

  // 4 — Sinyal doğruluk takibi
  const sg = d.sinyal_gecmisi;
  if (sg && sg.kayitlar && sg.kayitlar.length) {
    html += `<h2>🎯 Sinyal Doğruluk Takibi <span class="cnt">%${sg.basari_orani ?? '?'} başarı · ${sg.toplam} sinyal</span></h2>` +
      '<div class="twrap"><table><tr><th>Tarih</th><th>Hisse</th><th>Sinyal</th><th>Skor</th><th>Sinyal Fiyatı</th><th>Güncel</th><th>Getiri</th></tr><tbody>';
    sg.kayitlar.slice(0, 20).forEach(x => {
      html += `<tr><td>${x.tarih || ''}</td><td class="sym">${x.sembol}</td><td>${badge(x.sinyal)}</td>` +
        `<td style="color:${x.skor>=3?'var(--up)':x.skor<=-3?'var(--down)':'var(--warn)'}">${x.skor>0?'+':''}${x.skor}</td>` +
        `<td>${fmt(x.giris)}</td><td>${x.guncel == null ? '—' : fmt(x.guncel)}</td>` +
        `<td class="${ok(x.getiri)}">${x.getiri == null ? '—' : yuzde(x.getiri)}</td></tr>`;
    });
    html += '</tbody></table></div><div class="note">Gerçek veri: sinyal günü kapanış fiyatı ile bugünkü fiyat karşılaştırılır (sinyal gününden bugüne getiri). Her işlem günü 15 dakikada bir güncellenir — geçmiş büyüdükçe doğruluk anlamlılaşır.</div>';
  } else {
    html += '<h2>🎯 Sinyal Doğruluk Takibi <span class="cnt">veri toplanıyor</span></h2><div class="empty">Sinyal geçmişi henüz birikmedi — birkaç işlem günü sonra burada doğruluk oranı görünecek.</div>';
  }

  // 2.3 — Hisse bazlı backtest
  if (t.hisse_bazli && t.hisse_bazli.length) {
    html += '<h2>📈 Hisse Bazlı Backtest <span class="cnt">sinyal başına</span></h2><div class="twrap"><table><tr>' +
      '<th>Hisse</th><th>Toplam Getiri</th><th>İşlem</th><th>Başarı</th><th>Max Düşüş</th></tr><tbody>';
    t.hisse_bazli.forEach(x => {
      html += `<tr><td class="sym">${x.sembol}</td>` +
        `<td class="${ok(x.toplam_getiri)}">${x.toplam_getiri >= 0 ? '+' : ''}%${x.toplam_getiri.toFixed(1)}</td>` +
        `<td>${x.islem_sayisi}</td><td>%${x.basari_orani}</td>` +
        `<td class="down">%${x.max_dusus.toFixed(1)}</td></tr>`;
    });
    html += '</tbody></table></div>';
  }

  const ilk = (t.ertesi_gun_acilis && t.ertesi_gun_acilis.islemler) || [];
  if (ilk.length) {
    html += '<h2>🏆 En Kârlı Sinyaller (son 6 ay)</h2><div class="twrap"><table><tr><th>Hisse</th><th>Sinyal Tarihi</th><th>Giriş</th><th>Bugün</th><th>Getiri</th></tr><tbody>';
    ilk.slice(0, 10).forEach(x => {
      html += `<tr><td class="sym">${x.sembol}</td><td>${x.sinyal_tarih}</td><td>${fmt(x.giris)}</td>` +
        `<td>${fmt(x.bugun)}</td><td class="${ok(x.getiri_yuzde)}">${yuzde(x.getiri_yuzde)}</td></tr>`;
    });
    html += '</tbody></table></div>';
  }
  document.getElementById('sec-senaryo').innerHTML = html;
}

/* ══════════ HABER ══════════ */
function renderHaber(d) {
  let html = '<h2>📅 Ekonomik Takvim</h2>';
  if (d.takvim && d.takvim.length) {
    d.takvim.slice(0, 12).forEach(ev => {
      const cls = ev.onem === 'high' ? 'hi' : (ev.onem === 'mid' ? 'mi' : '');
      html += `<div class="ev"><div class="dt">${ev.tarih}</div><div class="tm">${ev.saat}</div>` +
              `<div class="nm"><span class="${cls}">${ev.ulke}</span> · ${ev.olay}</div></div>`;
    });
  } else html += '<div class="empty">Takvim verisi yok</div>';

  const tr = d.sinyaller && d.sinyaller.tarama;
  if (tr) {
    html += '<h2>🔍 Aşırı Satım (RSI &lt; 30) <span class="cnt">' + (tr.asiri_satim||[]).length + '</span></h2>';
    html += (tr.asiri_satim && tr.asiri_satim.length)
      ? '<div class="chips">' + tr.asiri_satim.map(r => `<span class="chip"><b style="color:var(--info)">${r.sembol}</b> ${fmt(r.fiyat)} <span class="r">RSI ${fmt(r.rsi,0)} · ${r.sinyal}</span></span>`).join('') + '</div>'
      : '<div class="empty" style="padding:6px 0">Yok</div>';
    html += '<h2>🔴 Aşırı Alım (RSI &gt; 75) <span class="cnt">' + (tr.asiri_alim||[]).length + '</span></h2>';
    html += (tr.asiri_alim && tr.asiri_alim.length)
      ? '<div class="chips">' + tr.asiri_alim.map(r => `<span class="chip"><b style="color:var(--down)">${r.sembol}</b> ${fmt(r.fiyat)} <span class="r">RSI ${fmt(r.rsi,0)} · ${r.sinyal}</span></span>`).join('') + '</div>'
      : '<div class="empty" style="padding:6px 0">Yok</div>';
    html += '<h2>🟢 MACD Güçlü (skor ≥ 2) <span class="cnt">' + (tr.macd_guclu||[]).length + '</span></h2>';
    html += (tr.macd_guclu && tr.macd_guclu.length)
      ? '<div class="chips">' + tr.macd_guclu.map(r => `<span class="chip"><b style="color:var(--up)">${r.sembol}</b> ${fmt(r.fiyat)} <span class="r">${r.sinyal} · skor ${r.skor > 0 ? '+' : ''}${r.skor}</span></span>`).join('') + '</div>'
      : '<div class="empty" style="padding:6px 0">Yok</div>';
  }

  html += '<h2>📰 Haberler & Duyurular</h2>';
  const hb = d.haberler;
  if (hb && hb.length) {
    hb.forEach(h => {
      const cls = h.yon === 'pozitif' ? 'b-AL' : (h.yon === 'negatif' ? 'b-SAT' : 'b-TUT');
      html += `<div class="ev"><div class="dt">${h.tarih || ''}</div><div class="nm">` +
        `<span class="badge ${cls}">${h.etiket}</span> <b>${h.sembol}</b> ${h.baslik}` +
        (h.yayinci ? `<br><small style="color:var(--tx2)">${h.yayinci}</small>` : '') +
        `</div></div>`;
    });
    html += '<div class="note">Kaynak: Yahoo Finance. Etiketler anahtar kelime kurallarıyla otomatik. Yatırım tavsiyesi değildir.</div>';
  } else {
    html += '<div class="empty">📡 Haber akışı kuruluyor — yakında</div>';
  }
  document.getElementById('sec-haber').innerHTML = html;
}

/* ══════════ FON ══════════ */
const SEKTOR_TR = {'Industrials':'Sanayi','Financial Services':'Finans','Basic Materials':'Hammadde',
  'Consumer Cyclical':'Tüketici','Consumer Defensive':'Temel Tüketim','Technology':'Teknoloji',
  'Communication Services':'İletişim','Energy':'Enerji','Utilities':'Kamu Hizmetleri',
  'Real Estate':'Gayrimenkul','Healthcare':'Sağlık'};
const sekTr = s => SEKTOR_TR[s] || s || '—';

function renderFon(d) {
  const f = d.fonlar;
  let html = '<h2>🏦 Fonlar & Kurumsal</h2>';

  if (f && f.fonlar && f.fonlar.length) {
    if (f.ozet && f.ozet.fon_sayisi) {
      html += `<h2>📊 Fonların Risk İştahı <span class="cnt">${f.tarih}</span></h2>`;
      html += '<div class="scn">' +
        `<div class="sc"><div class="t">İncelenen Fon</div><div class="o">${f.ozet.fon_sayisi}</div></div>` +
        `<div class="sc"><div class="t">Ort. Hisse Ağırlığı</div><div class="o ${f.ozet.ort_hisse_agirlik >= 50 ? 'up' : 'down'}">%${f.ozet.ort_hisse_agirlik}</div></div>` +
        (f.ozet.max_hisse_agirlik != null ? `<div class="sc"><div class="t">En Riskli Fon</div><div class="o up">%${f.ozet.max_hisse_agirlik}</div></div>` : '') +
        '</div>';
    }
    html += '<h2>📈 Fon Getirileri (TEFAS)</h2><div class="twrap"><table><tr>' +
      '<th>Fon</th><th>Hisse %</th><th>1 Ay</th><th>3 Ay</th><th>6 Ay</th><th>1 Yıl</th></tr><tbody>';
    f.fonlar.forEach(fn => {
      const g = fn.getiri || {};
      const h = x => x == null ? '—' : `<span class="${ok(x)}">${x >= 0 ? '+' : ''}%${x.toFixed(1)}</span>`;
      html += `<tr><td class="sym">${fn.kod}</td><td>%${fn.hisse_agirlik}</td>` +
        `<td>${h(g['1A'])}</td><td>${h(g['3A'])}</td><td>${h(g['6A'])}</td><td>${h(g['1Y'])}</td></tr>`;
    });
    html += '</tbody></table></div>';
    html += '<h2>📋 Fon Dağılımları</h2>';
    f.fonlar.forEach(fn => {
      const renk = fn.hisse_agirlik >= 50 ? 'var(--up)' : 'var(--warn)';
      html += `<div class="ev"><div class="nm"><b>${fn.kod}</b> · ${fn.tarih} · <span style="color:${renk}">Hisse %${fn.hisse_agirlik}</span><br>` +
        `<small style="color:var(--tx2)">${fn.varliklar.map(v=>`${v.sinif} %${v.agirlik}`).join(' · ')}</small></div></div>`;
    });
    html += '<div class="note">' + (f.not || '') + '</div>';
  } else {
    html += '<div class="empty">🏦 TEFAS fon verisi şu an yok — bir sonraki güncellemede</div>';
  }

  if (d.sektorler && d.sektorler.length) {
    html += '<h2>🏭 Sektör Dağılımı <span class="cnt">' + d.sektorler.length + '</span></h2><div class="twrap"><table><tr>' +
      '<th>Sektör</th><th>Hisse</th><th>Ort. Skor</th><th>🟢 AL</th><th>🔴 SAT</th><th>Dağılım</th></tr><tbody>';
    const maxH = Math.max(...d.sektorler.map(x => x.hisse_sayisi));
    d.sektorler.forEach(x => {
      const genislik = Math.round(x.hisse_sayisi / maxH * 100);
      html += `<tr><td class="sym">${sekTr(x.sektor)}</td><td>${x.hisse_sayisi}</td>` +
        `<td class="${ok(x.ort_skor)}">${x.ort_skor > 0 ? '+' : ''}${x.ort_skor}</td>` +
        `<td class="up">${x.al}</td><td class="down">${x.sat}</td>` +
        `<td style="min-width:110px"><div class="bar"><i style="width:${genislik}%;background:var(--accent)"></i></div></td></tr>`;
    });
    html += '</tbody></table></div><div class="note">Sektörler Yahoo Finance resmi sınıflandırmasıdır.</div>';
  }

  if (d.temel_analiz && d.temel_analiz.length) {
    html += '<h2>💎 Temel Analiz — BIST 30 <span class="cnt">değer skoru</span></h2><div class="twrap"><table><tr>' +
      '<th>Hisse</th><th>F/K</th><th>PD/DD</th><th>Temettü</th><th>Skor</th><th>Not</th></tr><tbody>';
    d.temel_analiz.forEach(x => {
      let notlar = [];
      if (x.fk != null && x.fk < 5) notlar.push('F/K çok ucuz');
      else if (x.fk != null && x.fk < 10) notlar.push('F/K ucuz');
      if (x.pddd != null && x.pddd < 1) notlar.push('PD/DD defter altı');
      if (x.temettu != null && x.temettu > 3) notlar.push('Yüksek temettü');
      html += `<tr><td class="sym">${x.sembol}</td>` +
        `<td>${x.fk == null ? '—' : fmt(x.fk)}</td>` +
        `<td>${x.pddd == null ? '—' : fmt(x.pddd)}</td>` +
        `<td>${x.temettu == null ? '—' : '%' + fmt(x.temettu,1)}</td>` +
        `<td style="color:${x.skor >= 3 ? 'var(--up)' : 'var(--warn)'};font-weight:700">+${x.skor}</td>` +
        `<td class="ned">${notlar.join(' · ') || '—'}</td></tr>`;
    });
    html += '</tbody></table></div><div class="note">Değer skoru: F/K&lt;5 (+2), &lt;10 (+1); PD/DD&lt;1 (+2), &lt;1.5 (+1); temettü&gt;%3 (+1).</div>';
  }
  document.getElementById('sec-fon').innerHTML = html;
}

yukle();
setInterval(yukle, 900000); // 15 dk'da bir tazele
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
